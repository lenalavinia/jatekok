<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Négy a nyerő</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #222;
        color: #fff;
        text-align: center;
        margin: 0;
        padding: 20px;
    }
    .container {
        max-width: 100%;
        margin: 0 auto;
        padding: 0 10px;
    }

    /* Kezdőképernyő */
    #start-screen {
        margin-top: 40px;
    }
    #start-screen h1 {
        font-size: 48px;
        margin-bottom: 30px;
        color: #3498db;
        text-shadow: 0 0 15px rgba(52, 152, 219, 0.6);
    }
    .input-group {
        margin: 18px 0;
        font-size: 20px;
    }
    .input-group input {
        padding: 12px 16px;
        font-size: 18px;
        width: 280px;
        border-radius: 12px;
        border: none;
        background: #333;
        color: white;
        margin-top: 8px;
    }
    .size-inputs {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin: 25px 0;
        flex-wrap: wrap;
    }
    .size-inputs label {
        font-size: 18px;
    }
    .size-inputs input {
        width: 80px;
        text-align: center;
    }

    /* Játék képernyő */
    .top {
        margin: 15px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
    }
    #status {
        font-size: 26px;
        margin: 15px 0;
        min-height: 38px;
    }

    .board-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: auto;
        padding: 10px 0;
    }

    #numbers {
        display: grid;
        gap: 8px;
        width: max-content;
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 4px;
    }
    #board {
        display: grid;
        gap: 8px;
        background: #1565C0;
        padding: 12px;
        border-radius: 16px;
        width: max-content;
    }
    .cell {
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        box-shadow: inset 0 4px 8px rgba(0,0,0,0.3);
    }
    .green { background: limegreen; }
    .pink { background: hotpink; }

    /* Fancy gombok */
    button {
        background-color: #3498db;
        border: none;
        padding: 12px 24px;
        margin: 5px;
        border-radius: 30px;
        color: white;
        font-size: 18px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    button:hover {
        background-color: #2ecc71;
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }
    button::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition: width 0.6s ease, height 0.6s ease;
    }
    button:hover::before {
        width: 300px;
        height: 300px;
    }
    .spinning-text {
        display: inline-block;
        transition: transform 0.3s ease;
    }
    button:hover .spinning-text {
        animation: spinX 0.8s infinite linear;
    }
    @keyframes spinX {
        0% { transform: rotateX(0deg); }
        100% { transform: rotateX(360deg); }
    }
    .hidden { display: none !important; }
</style>
</head>
<body>
    <div class="container">

        <!-- KEZDŐKÉPERNYŐ -->
        <div id="start-screen">
            <h1>Négy a nyerő</h1>
           
            <div class="input-group">
                Játékos 1 (zöld):<br>
                <input id="n1" value="Játékos 1" maxlength="20">
            </div>
            <div class="input-group">
                Játékos 2 (rózsaszín):<br>
                <input id="n2" value="Játékos 2" maxlength="20">
            </div>

            <div class="size-inputs">
                <div>
                    <label>Sorok (6-7): </label><br>
                    <input id="rows" type="number" value="6" min="6" max="7">
                </div>
                <div>
                    <label>Oszlopok (7-20): </label><br>
                    <input id="cols" type="number" value="7" min="7" max="20">
                </div>
            </div>

            <button onclick="toggleSound()" id="soundToggle">
                <span class="spinning-text">Hang bekapcsolva 🔊</span>
            </button>

            <button onclick="startGame()">
                <span class="spinning-text">▶ INDÍTÁS</span>
            </button>
        </div>

        <!-- JÁTÉK KÉPERNYŐ -->
        <div id="game-screen" class="hidden">
            <h2>Négy a nyerő</h2>
           
            <div class="top">
                <span>Játékos 1: <strong id="p1name"></strong> 🟢</span>
                <span>Játékos 2: <strong id="p2name"></strong> 🩷</span>
                <button onclick="toggleSound()" id="soundToggleGame" style="padding: 10px 16px; font-size: 22px;">
                    <span class="spinning-text">🔊</span>
                </button>
                <button onclick="backToStart()">
                    <span class="spinning-text">Új játék</span>
                </button>
            </div>
            <div id="status"></div>
           
            <div class="board-wrapper">
                <div id="numbers"></div>
                <div id="board"></div>
            </div>
        </div>
    </div>

<script>
let R = 6, C = 7;
const b = [], cells = [];
let p = 1, over = false;
let player1 = "Játékos 1";
let player2 = "Játékos 2";
let soundEnabled = true;

const bd = document.getElementById('board');
const nums = document.getElementById('numbers');
const st = document.getElementById('status');
const startScreen = document.getElementById('start-screen');
const gameScreen = document.getElementById('game-screen');

const fanfare = new Audio('fanfare.mp3');
const dropSound = new Audio('zseton.mp3');   // ← Új zseton hang

const soundToggleStart = document.getElementById('soundToggle');
const soundToggleGame = document.getElementById('soundToggleGame');

// Globális Enter billentyű
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        if (!startScreen.classList.contains('hidden')) startGame();
        else if (!gameScreen.classList.contains('hidden')) {
            if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                backToStart();
            }
        }
    }
});

function updateSoundUI() {
    if (soundEnabled) {
        soundToggleStart.innerHTML = `<span class="spinning-text">Hang bekapcsolva 🔊</span>`;
        soundToggleGame.innerHTML = `<span class="spinning-text">🔊</span>`;
    } else {
        soundToggleStart.innerHTML = `<span class="spinning-text">Hang kikapcsolva 🔇</span>`;
        soundToggleGame.innerHTML = `<span class="spinning-text">🔇</span>`;
    }
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    updateSoundUI();
}

function startGame() {
    R = parseInt(document.getElementById('rows').value) || 6;
    C = parseInt(document.getElementById('cols').value) || 7;
    
    if (R < 6) R = 6; if (R > 7) R = 7;
    if (C < 7) C = 7; if (C > 20) C = 20;

    player1 = document.getElementById('n1').value.trim() || 'Játékos 1';
    player2 = document.getElementById('n2').value.trim() || 'Játékos 2';
    
    document.getElementById('p1name').textContent = player1;
    document.getElementById('p2name').textContent = player2;
    
    startScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    
    resetBoard();
}

function backToStart() {
    gameScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
}

function resetBoard(){
    over = false;
    p = 1;
    b.length = 0;
    for(let r = 0; r < R; r++){
        b[r] = [];
        for(let c = 0; c < C; c++) b[r][c] = 0;
    }
    draw();
}

function draw(){
    const size = '70px';
    const gridStyle = `repeat(${C}, ${size})`;
    
    nums.style.gridTemplateColumns = gridStyle;
    nums.innerHTML = '';
    for(let c = 1; c <= C; c++){
        let d = document.createElement('div');
        d.textContent = c;
        nums.appendChild(d);
    }

    bd.style.gridTemplateColumns = gridStyle;
    bd.innerHTML = '';
    cells.length = 0;
    for(let r = 0; r < R; r++){
        cells[r] = [];
        for(let c = 0; c < C; c++){
            let d = document.createElement('div');
            d.className = 'cell';
            d.style.width = size;
            d.style.height = size;
            d.onclick = () => move(c);
            bd.appendChild(d);
            cells[r][c] = d;
        }
    }
    render();
}

function render(){
    for(let r = 0; r < R; r++){
        for(let c = 0; c < C; c++){
            let e = cells[r][c];
            e.className = 'cell';
            if(b[r][c] == 1) e.classList.add('green');
            if(b[r][c] == 2) e.classList.add('pink');
        }
    }
    if(!over) {
        st.textContent = (p==1 ? player1 + ' 🟢' : player2 + ' 🩷') + ' következik';
    }
}

function move(c){
    if(over) return;
    for(let r = R-1; r >= 0; r--){
        if(b[r][c] == 0){
            b[r][c] = p;
            
            // Zseton lehullik → hang
            if (soundEnabled) {
                dropSound.currentTime = 0;
                dropSound.play().catch(() => {});
            }
            
            render();
           
            if(win(r,c)){
                over = true;
                st.textContent = '🏆 ' + (p==1 ? player1 : player2) + ' nyert!';
                if (soundEnabled) {
                    fanfare.currentTime = 0;
                    fanfare.play().catch(() => {});
                }
                return;
            }
           
            if(full()){
                over = true;
                st.textContent = '🤝 Döntetlen!';
                return;
            }
           
            p = p==1 ? 2 : 1;
            render();
            return;
        }
    }
}

function full(){
    for(let r = 0; r < R; r++)
        for(let c = 0; c < C; c++)
            if(!b[r][c]) return false;
    return true;
}

function win(r, c){
    let v = b[r][c], D = [[1,0],[0,1],[1,1],[1,-1]];
    for(let d of D){
        let n = 1;
        for(let s = 1; ; s++){
            let rr = r + d[0]*s, cc = c + d[1]*s;
            if(rr < 0 || rr >= R || cc < 0 || cc >= C || b[rr][cc] != v) break;
            n++;
        }
        for(let s = 1; ; s++){
            let rr = r - d[0]*s, cc = c - d[1]*s;
            if(rr < 0 || rr >= R || cc < 0 || cc >= C || b[rr][cc] != v) break;
            n++;
        }
        if(n >= 4) return true;
    }
    return false;
}

// Kezdeti UI
updateSoundUI();
</script>
</body>
</html>
