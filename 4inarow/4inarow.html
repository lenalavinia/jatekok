<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Négy a nyerő</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #222;
        color: #fff;
        text-align: center;
        margin: 0;
        padding: 20px;
    }

    .top {
        margin: 15px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    .top input {
        padding: 8px 12px;
        font-size: 16px;
        border-radius: 8px;
        border: none;
        background: #333;
        color: white;
    }

    #status {
        font-size: 26px;
        margin: 15px 0;
        min-height: 38px;
    }

    #numbers {
        display: grid;
        grid-template-columns: repeat(7, 70px);
        gap: 8px;
        width: max-content;
        margin: 0 auto 8px auto;
        font-size: 22px;
        font-weight: bold;
    }

    #numbers div {
        text-align: center;
    }

    #board {
        display: grid;
        grid-template-columns: repeat(7, 70px);
        gap: 8px;
        background: #1565C0;
        padding: 12px;
        border-radius: 16px;
        width: max-content;
        margin: 20px auto;
    }

    .cell {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        box-shadow: inset 0 4px 8px rgba(0,0,0,0.3);
    }

    .green { background: limegreen; }
    .pink { background: hotpink; }

    button {
        background-color: #3498db;
        border: none;
        padding: 12px 24px;
        margin: 5px;
        border-radius: 25px;
        color: white;
        font-size: 18px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    button:hover {
        background-color: #2ecc71;
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    button::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition: width 0.6s ease, height 0.6s ease;
    }

    button:hover::before {
        width: 300px;
        height: 300px;
    }

    .spinning-text {
        display: inline-block;
        transition: transform 0.3s ease;
    }

    button:hover .spinning-text {
        animation: spinX 0.8s infinite linear;
    }

    @keyframes spinX {
        0% { transform: rotateX(0deg); }
        100% { transform: rotateX(360deg); }
    }
</style>
</head>
<body>
    <h2>Négy a nyerő</h2>
    
    <div class="top">
        Játékos 1: <input id="n1" value="Játékos 1">
        Játékos 2: <input id="n2" value="Játékos 2">
        <button onclick="resetGame()">
            <span class="spinning-text">Új játék</span>
        </button>
    </div>

    <div id="status"></div>

    <div id="numbers">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
    </div>

    <div id="board"></div>

<script>
const R=6, C=7, b=[], cells=[];
let p=1, over=false;
const bd=document.getElementById('board'), st=document.getElementById('status');
const p1=()=>document.getElementById('n1').value||'Játékos 1';
const p2=()=>document.getElementById('n2').value||'Játékos 2';

const fanfare = new Audio('fanfare.mp3');

function resetGame(){
    over=false;
    p=1;
    for(let r=0;r<R;r++){
        b[r]=[];
        for(let c=0;c<C;c++) b[r][c]=0;
    }
    draw();
}

function draw(){
    bd.innerHTML='';
    for(let r=0;r<R;r++){
        cells[r]=[];
        for(let c=0;c<C;c++){
            let d=document.createElement('div');
            d.className='cell';
            d.onclick=()=>move(c);
            bd.appendChild(d);
            cells[r][c]=d;
        }
    }
    render();
}

function render(){
    for(let r=0;r<R;r++){
        for(let c=0;c<C;c++){
            let e=cells[r][c];
            e.className='cell';
            if(b[r][c]==1) e.classList.add('green');
            if(b[r][c]==2) e.classList.add('pink');
        }
    }
    if(!over) st.textContent = (p==1 ? p1()+' 🟢' : p2()+' 🩷') + ' következik';
}

function move(c){
    if(over) return;
    for(let r=R-1; r>=0; r--){
        if(b[r][c]==0){
            b[r][c]=p;
            render();
            
            if(win(r,c)){
                over=true;
                st.textContent = '🏆 ' + (p==1 ? p1() : p2()) + ' nyert!';
                fanfare.currentTime = 0;
                fanfare.play().catch(e => console.log('Hang lejátszása sikertelen:', e));
                return;
            }
            
            if(full()){
                over=true;
                st.textContent='🤝 Döntetlen!';
                return;
            }
            
            p = p==1 ? 2 : 1;
            render();
            return;
        }
    }
}

function full(){
    for(let r=0;r<R;r++) 
        for(let c=0;c<C;c++) 
            if(!b[r][c]) return false;
    return true;
}

function win(r,c){
    let v=b[r][c], D=[[1,0],[0,1],[1,1],[1,-1]];
    for(let d of D){
        let n=1;
        for(let s=1; ;s++){
            let rr=r+d[0]*s, cc=c+d[1]*s;
            if(rr<0||rr>=R||cc<0||cc>=C||b[rr][cc]!=v) break;
            n++;
        }
        for(let s=1; ;s++){
            let rr=r-d[0]*s, cc=c-d[1]*s;
            if(rr<0||rr>=R||cc<0||cc>=C||b[rr][cc]!=v) break;
            n++;
        }
        if(n>=4) return true;
    }
    return false;
}

resetGame();
</script>
</body>
</html>
