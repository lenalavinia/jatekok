<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Tetris - Kétjátékos</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #gameContainer {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }
        .playerArea {
            text-align: center;
        }
        canvas {
            border: 2px solid white;
            display: block;
            margin: 0 auto;
        }
        .score, #highScoreDisplay {
            color: white;
            font-size: 20px;
            margin-top: 10px;
            min-height: 50px;
        }
        #highScoreDisplay {
            text-align: center;
            width: 100%;
            margin-bottom: 20px;
        }
        #playAgainDialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: black;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
            z-index: 1000;
            text-align: center;
        }
        #playAgainDialog p {
            margin-bottom: 15px;
            font-size: 18px;
        }
        #playAgainDialog button {
            margin: 0 15px;
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .playerLabel {
            color: white;
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div>
        <div id="highScoreDisplay">High Score: 0 - None</div>
        <div id="gameContainer">
            <div class="playerArea">
                <div class="playerLabel">Játékos 1 (Nyilak)</div>
                <canvas id="gameCanvas1" width="300" height="600"></canvas>
                <div id="score1" class="score">Score: 0</div>
            </div>
            <div class="playerArea">
                <div class="playerLabel">Játékos 2 (Q,W,E,S)</div>
                <canvas id="gameCanvas2" width="300" height="600"></canvas>
                <div id="score2" class="score">Score: 0</div>
            </div>
        </div>
    </div>

    <div id="playAgainDialog">
        <p id="gameOverMessage">Játék vége!</p>
        <p>Szeretnétek újra játszani?</p>
        <button id="yesButton">Igen</button>
        <button id="noButton">Nem</button>
    </div>

    <script>
        // --- Konstansok és Globális Változók ---
        const ROWS = 20;
        const COLS = 10;
        const BLOCK_SIZE = 30;

        const SHAPES = [
            [[1,1,1,1]],       // I
            [[1,1,1],[0,1,0]], // T
            [[1,1,1],[1,0,0]], // L
            [[1,1,1],[0,0,1]], // J (fordított L)
            [[1,1],[1,1]],     // O
            [[0,1,1],[1,1,0]], // S
            [[1,1,0],[0,1,1]]  // Z (fordított S)
        ];

        const COLORS = ['#00ffff', '#800080', '#ffa500', '#ffff00', '#008000', '#ff0000', '#0000ff'];

        let highScore = localStorage.getItem('tetrisHighScore') ? parseInt(localStorage.getItem('tetrisHighScore')) : 0;
        let highScoreName = localStorage.getItem('tetrisHighScoreName') || 'None';

        let gameRunning = true;
        let animationFrameId = null;
        let lastTime = 0;
        const gameSpeed = 800;

        // --- Játékos Objektumok Inicializálása ---
        function createPlayer(canvasId, scoreId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const scoreElement = document.getElementById(scoreId);
            ctx.canvas.width = COLS * BLOCK_SIZE;
            ctx.canvas.height = ROWS * BLOCK_SIZE;

            return {
                canvas: canvas,
                ctx: ctx,
                scoreElement: scoreElement,
                board: Array(ROWS).fill().map(() => Array(COLS).fill(0)),
                currentPiece: null,
                score: 0,
                gameOver: false,
                lastMoveTime: 0
            };
        }

        let player1 = createPlayer('gameCanvas1', 'score1');
        let player2 = createPlayer('gameCanvas2', 'score2');

        const playAgainDialog = document.getElementById('playAgainDialog');
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const highScoreElement = document.getElementById('highScoreDisplay');
        const gameOverMessageElement = document.getElementById('gameOverMessage');

        // --- Darab Osztály ---
        class Piece {
            constructor(player) {
                const shapeIndex = Math.floor(Math.random() * SHAPES.length);
                this.shape = SHAPES[shapeIndex];
                this.color = COLORS[shapeIndex];
                this.player = player;
                this.x = Math.floor(COLS / 2) - Math.floor(this.shape[0].length / 2);
                this.y = 0;
            }

            draw() {
                this.player.ctx.fillStyle = this.color;
                this.shape.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            this.player.ctx.fillRect(
                                (this.x + x) * BLOCK_SIZE,
                                (this.y + y) * BLOCK_SIZE,
                                BLOCK_SIZE - 1,
                                BLOCK_SIZE - 1
                            );
                        }
                    });
                });
            }

            canMove(offsetX, offsetY, newShape = this.shape) {
                return newShape.every((row, y) => {
                    return row.every((value, x) => {
                        if (!value) return true;
                        let newX = this.x + x + offsetX;
                        let newY = this.y + y + offsetY;
                        return (
                            newX >= 0 && newX < COLS &&
                            newY < ROWS &&
                            (newY < 0 || !this.player.board[newY] || !this.player.board[newY][newX])
                        );
                    });
                });
            }

            moveDown() {
                if (this.canMove(0, 1)) {
                    this.y++;
                    return true;
                }
                return false;
            }

            moveLeft() {
                if (this.canMove(-1, 0)) {
                    this.x--;
                    return true;
                }
                return false;
            }

            moveRight() {
                if (this.canMove(1, 0)) {
                    this.x++;
                    return true;
                }
                return false;
            }

            rotate() {
                const N = this.shape.length;
                const M = this.shape[0].length;
                const newShape = Array(M).fill(0).map(() => Array(N).fill(0));
                for (let y = 0; y < N; y++) {
                    for (let x = 0; x < M; x++) {
                        if (this.shape[y][x]) {
                            newShape[x][N - 1 - y] = this.shape[y][x];
                        }
                    }
                }
                let potentialX = this.x;
                if (!this.canMove(0, 0, newShape)) {
                    if (this.canMove(1, 0, newShape)) { potentialX++; }
                    else if (this.canMove(-1, 0, newShape)) { potentialX--; }
                    else if (this.canMove(2, 0, newShape)) { potentialX += 2; }
                    else if (this.canMove(-2, 0, newShape)) { potentialX -= 2; }
                    else { return; }
                }
                this.shape = newShape;
                this.x = potentialX;
            }
        }

        // --- Játék Logikai Függvények ---
        function updateScore(player, lines) {
            let points = 0;
            switch(lines) {
                case 1: points = 40; break;
                case 2: points = 100; break;
                case 3: points = 300; break;
                case 4: points = 1200; break;
            }
            player.score += points;
            player.scoreElement.textContent = `Score: ${player.score}`;
            if (player.score > highScore) {
                highScore = player.score;
                updateHighScoreDisplay();
            }
        }

        function checkLines(player) {
            let linesCleared = 0;
            for (let y = ROWS - 1; y >= 0; y--) {
                if (player.board[y].every(cell => cell !== 0)) {
                    player.board.splice(y, 1);
                    player.board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    y++;
                }
            }
            if (linesCleared > 0) {
                updateScore(player, linesCleared);
            }
        }

        function placePiece(player) {
            if (!player.currentPiece) {
                console.warn(`placePiece called for player, but no currentPiece exists.`);
                return;
            }

            player.currentPiece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value && (player.currentPiece.y + y >= 0)) {
                        player.board[player.currentPiece.y + y][player.currentPiece.x + x] = player.currentPiece.color;
                    }
                });
            });

            checkLines(player);

            // Új darab létrehozása
            player.currentPiece = new Piece(player);

            // Ellenőrizzük, hogy az új darab elhelyezhető-e
            if (!player.currentPiece.canMove(0, 0)) {
                player.gameOver = true;
                player.currentPiece = null;
                if (player1.gameOver && player2.gameOver) {
                    endGame();
                } else {
                    drawBoard(player);
                }
            }
        }

        function updatePlayer(player, deltaTime) {
            if (player.gameOver || !player.currentPiece) return;
            player.lastMoveTime += deltaTime;
            if (player.lastMoveTime >= gameSpeed) {
                if (!player.currentPiece.moveDown()) {
                    placePiece(player);
                }
                if (!player.gameOver && player.currentPiece) {
                    player.lastMoveTime = 0;
                }
            }
        }

        function drawBoard(player) {
            player.ctx.fillStyle = '#000';
            player.ctx.fillRect(0, 0, player.canvas.width, player.canvas.height);
            player.board.forEach((row, y) => {
                row.forEach((color, x) => {
                    if (color !== 0) {
                        player.ctx.fillStyle = color;
                        player.ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
                    }
                });
            });
            if (player.currentPiece && !player.gameOver) {
                player.currentPiece.draw();
            }
            if (player.gameOver) {
                player.ctx.fillStyle = 'rgba(50, 50, 50, 0.75)';
                player.ctx.fillRect(0, player.canvas.height / 2 - 30, player.canvas.width, 60);
                player.ctx.font = '30px Arial';
                player.ctx.fillStyle = 'white';
                player.ctx.textAlign = 'center';
                player.ctx.fillText('Game Over', player.canvas.width / 2, player.canvas.height / 2 + 10);
            }
        }

        function updateHighScoreDisplay() {
            highScoreElement.textContent = `High Score: ${highScore} - ${highScoreName}`;
        }

        function promptForHighScoreName() {
            let currentTopScore = Math.max(player1.score, player2.score);
            if (currentTopScore > parseInt(localStorage.getItem('tetrisHighScore') || '0')) {
                let playerName = prompt(`Új Magas Pontszám: ${currentTopScore}!\nAdd meg a neved (vagy hagyd üresen):`);
                if (playerName && playerName.trim() !== '') {
                    highScore = currentTopScore;
                    highScoreName = playerName.trim();
                    localStorage.setItem('tetrisHighScore', highScore);
                    localStorage.setItem('tetrisHighScoreName', highScoreName);
                } else {
                    highScore = currentTopScore;
                    highScoreName = "Anonymous";
                    localStorage.setItem('tetrisHighScore', highScore);
                    localStorage.setItem('tetrisHighScoreName', highScoreName);
                }
            }
            updateHighScoreDisplay();
        }

        function endGame() {
            gameRunning = false;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            let winnerMessage = "";
            if (player1.score > player2.score) { winnerMessage = "Játékos 1 nyert!"; }
            else if (player2.score > player1.score) { winnerMessage = "Játékos 2 nyert!"; }
            else { winnerMessage = "Döntetlen!"; }

            let message = `Játék vége! ${winnerMessage}`;
            message += `\nVégső pontszámok: J1: ${player1.score}, J2: ${player2.score}`;
            gameOverMessageElement.innerText = message;

            promptForHighScoreName();
            playAgainDialog.style.display = 'block';
        }

        function resetGame() {
            [player1, player2].forEach(player => {
                player.board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
                player.score = 0;
                player.gameOver = false;
                player.currentPiece = new Piece(player);
                player.scoreElement.textContent = `Score: 0`;
                player.lastMoveTime = 0;
            });
            gameRunning = true;
            playAgainDialog.style.display = 'none';
            lastTime = 0;
            updateHighScoreDisplay();
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            if (!gameRunning) return;
            if (!lastTime) lastTime = timestamp;
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            updatePlayer(player1, deltaTime);
            updatePlayer(player2, deltaTime);

            drawBoard(player1);
            drawBoard(player2);

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown'].includes(e.key)) {
                e.preventDefault();
            }
            if (!gameRunning) return;
            let playerToControl = null;
            let action = null;

            if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp'].includes(e.key)) {
                if (!player1.gameOver) { playerToControl = player1; } else { return; }
                switch(e.key) {
                    case 'ArrowLeft': action = 'left'; break;
                    case 'ArrowRight': action = 'right'; break;
                    case 'ArrowDown': action = 'down'; break;
                    case 'ArrowUp': action = 'rotate'; break;
                }
            }
            else if (['q', 'Q', 'w', 'W', 'e', 'E', 's', 'S'].includes(e.key)) {
                if (!player2.gameOver) { playerToControl = player2; } else { return; }
                let keyLower = e.key.toLowerCase();
                switch(keyLower) {
                    case 'q': action = 'left'; break;
                    case 'e': action = 'right'; break;
                    case 's': action = 'down'; break;
                    case 'w': action = 'rotate'; break;
                }
            } else { return; }

            if (playerToControl && action) {
                const piece = playerToControl.currentPiece;
                if (!piece) { return; }

                let moved = false;
                switch (action) {
                    case 'left': moved = piece.moveLeft(); break;
                    case 'right': moved = piece.moveRight(); break;
                    case 'down':
                        if (!piece.moveDown()) { placePiece(playerToControl); }
                        else { playerToControl.lastMoveTime = 0; moved = true; }
                        break;
                    case 'rotate': piece.rotate(); moved = true; break;
                }
                if (moved) { drawBoard(playerToControl); }
            }
        });

        yesButton.addEventListener('click', () => { resetGame(); });
        noButton.addEventListener('click', () => { playAgainDialog.style.display = 'none'; });

        function initGame() {
            // Inicializáljuk a játékosokat
            player1.currentPiece = new Piece(player1);
            player2.currentPiece = new Piece(player2);

            // Ellenőrizzük, hogy az első darabok elhelyezhetők-e
            if (!player1.currentPiece.canMove(0, 0)) {
                console.error("Player 1 cannot place initial piece. Check board initialization.");
                player1.gameOver = true;
            }
            if (!player2.currentPiece.canMove(0, 0)) {
                console.error("Player 2 cannot place initial piece. Check board initialization.");
                player2.gameOver = true;
            }

            // Ha mindkét játékos kiesett az inicializáció során, valami nagyon nincs rendben
            if (player1.gameOver && player2.gameOver) {
                console.error("Both players are in gameOver state at initialization. Aborting.");
                return;
            }

            updateHighScoreDisplay();
            drawBoard(player1);
            drawBoard(player2);
            gameLoop(0);
        }

        initGame();
    </script>
</body>
</html>
