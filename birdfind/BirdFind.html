  --green-deep:#3F6B42;
  --sky:#7EB6C9;
  --sky-soft:#D8EEF4;
  --sun:#F2B84B;
  --sun-soft:#FDEBC0;
  --red-soft:#FBE0D8;
  --red:#C45A4A;
  --surface:#FFF6E3;
}

@media (prefers-color-scheme: dark){
  :root{
    --cream:#211D18;
    --paper:#2B2620;
    --card:#332D25;
    --ink:#FFF3DC;
    --muted:#C6BBA6;
    --line:#4A4234;
    --green:#8AB88A;
    --green-soft:#2F4430;
    --green-deep:#B7D9B4;
    --sky:#8CC4D6;
    --sky-soft:#263D46;
    --sun:#F2B84B;
    --sun-soft:#4A3A1E;
    --red-soft:#4A2A26;
    --red:#FF8A76;
    --surface:#211D18;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0
}

body{
  background:var(--cream);
  color:var(--ink);
  font-family:"Nunito",system-ui,-apple-system,sans-serif
}

.font-display{
  font-family:"Fraunces",Georgia,serif
}

button{
  font-family:inherit
}

.board-shadow{
  box-shadow:0 18px 45px rgba(84,58,20,.14), 0 3px 0 rgba(84,58,20,.06)
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }

  50%{
    transform:translateY(-7px) rotate(2deg)
  }
}

@keyframes pop{
  0%{
    transform:scale(.7)
  }

  70%{
    transform:scale(1.08)
  }

  100%{
    transform:scale(1)
  }
}

@keyframes fall{
  0%{
    transform:translateY(-20vh) rotate(0deg);
    opacity:1
  }

  100%{
    transform:translateY(110vh) rotate(540deg);
    opacity:.9
  }
}

@keyframes shake{
  0%,100%{
    transform:translateX(0)
  }

  25%{
    transform:translateX(-3px)
  }

  75%{
    transform:translateX(3px)
  }
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}

.animate-floaty{
  animation:floaty 3.2s ease-in-out infinite
}

.animate-pop{
  animation:pop .25s ease-out
}

.animate-shake{
  animation:shake .28s ease-in-out
}

.confetti-piece{
  position:absolute;
  top:-30px;
  animation:fall linear forwards
}

.cell-btn{
  transition:transform .08s ease, background .15s ease, box-shadow .15s ease
}

.cell-btn:active{
  transform:scale(.94)
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.hover\:opacity-70:hover{
  opacity: 0.7;
}

@media (min-width: 640px){
  .sm\:block{
    display: block;
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:justify-center{
    justify-content: center;
  }

  .sm\:rounded-\[12px\]{
    border-radius: 12px;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-6{
    padding-top: 1.5rem;
  }

  .sm\:text-\[11px\]{
    font-size: 11px;
  }

  .sm\:text-\[15px\]{
    font-size: 15px;
  }

  .sm\:text-\[26px\]{
    font-size: 26px;
  }

  .sm\:text-\[42px\]{
    font-size: 42px;
  }

  .sm\:text-xs{
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 768px){
  .md\:block{
    display: block;
  }
}

@media (min-width: 1024px){
  .lg\:order-1{
    order: 1;
  }

  .lg\:order-2{
    order: 2;
  }

  .lg\:block{
    display: block;
  }

  .lg\:grid-cols-6{
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[300px_1fr\]{
    grid-template-columns: 300px 1fr;
  }

  .lg\:gap-5{
    gap: 1.25rem;
  }
}
