<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teniszjáték</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: sans-serif;
            flex-direction: column;
        }
        #info {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }
        canvas {
            border: 2px solid black;
            display: block;
            margin: auto;
        }
        #playAgainDialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 25px 35px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            z-index: 1000;
            text-align: center;
        }
        #playAgainDialog p {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: bold;
        }
        #playAgainDialog .button-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
        }
        #playAgainDialog button {
            background-color: #3498db;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #playAgainDialog button:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background-color: #2ecc71;
        }
        #playAgainDialog button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }
        #playAgainDialog button:hover::before {
            width: 300px;
            height: 300px;
        }
        #playAgainDialog button .spinning-text {
            display: inline-block;
            transition: transform 0.3s ease;
        }
        #playAgainDialog button:hover .spinning-text {
            animation: spinX 1s infinite linear;
        }
        @keyframes spinX {
            0% {
                transform: rotateX(0deg);
            }
            100% {
                transform: rotateX(360deg);
            }
        }
        #winnerMessage {
            display: none;
            text-align: center;
            margin-top: 20px;
            font-size: 1.5em;
            color: blue;
            font-family: sans-serif;
        }
        #winnerMessage p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <!-- Információs rész a játék felett -->
    <div id="info">
        <span id="elapsedTime">00:00</span> <!-- Eltelt idő -->
        <span id="score" style="margin-left: 50px;">0:0</span> <!-- Eredmény -->
    </div>

    <!-- Győztes üzenet -->
    <div id="winnerMessage">
        <p id="winnerText"></p>
        <p id="finalScore"></p>
    </div>

    <!-- Játék újrakezdése dialógus -->
    <div id="playAgainDialog">
        <p>Akar még játszani?</p>
        <div class="button-container">
            <button id="yesButton"><span class="spinning-text">Igen</span></button>
            <button id="noButton"><span class="spinning-text">Nem</span></button>
        </div>
    </div>

    <!-- p5.js könyvtár -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>

    <script>
        let player1Y, player2Y;
        let ballX, ballY;
        let ballSpeedX, ballSpeedY;
        let player1Score = 0, player2Score = 0;
        let gameOver = false;
        let winner = "";
        let obstacles = [];
        let lastObstacleChange = 0;
        let maxObstacles = 10; // Maximum akadályok száma
        let startTime, lastSpeedIncrease;
        let ballColor;

        const playAgainDialog = document.getElementById('playAgainDialog');
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const elapsedTimeElement = document.getElementById('elapsedTime');
        const scoreElement = document.getElementById('score');

        function setup() {
            let canvas = createCanvas(960, 540);
            canvas.parent(document.body);
            resetGame();
        }

        function draw() {
            background(255);

            // Eltelt idő kiszámítása
            let elapsedTime = millis() - startTime;
            let minutes = floor(elapsedTime / 60000);
            let seconds = floor((elapsedTime % 60000) / 1000);
            let timeDisplay = nf(minutes, 2) + ":" + nf(seconds, 2); // Formázott idő (MM:SS)
            
            // Eltelt idő kiírása
            elapsedTimeElement.textContent = timeDisplay;

            // Eredmény kiírása
            scoreElement.textContent = player1Score + ":" + player2Score;

            manageObstacles();

            // Játékos 1 (zöld) mozgása
            if (keyIsDown(UP_ARROW) && player1Y > 0) {
                player1Y -= 5;
            }
            if (keyIsDown(DOWN_ARROW) && player1Y < height - 50) {
                player1Y += 5;
            }

            fill(0, 128, 0);
            rect(10, player1Y, 10, 50);

            // Játékos 2 (sárga) mozgása
            player2Y = mouseY;
            player2Y = constrain(player2Y, 0, height - 50);
            fill(255, 255, 0);
            rect(width - 20, player2Y, 10, 50);

            ballX += ballSpeedX;
            ballY += ballSpeedY;

            // Ütközés a felső és alsó falakkal
            if (ballY <= 5 || ballY >= height - 5) {
                ballSpeedY *= -1;
                ballY = constrain(ballY, 5, height - 5);
            }

            // Ütközés az első játékos ütőjével
            if (ballX <= 25 && ballX > 15 && ballY >= player1Y && ballY <= player1Y + 50) {
                ballSpeedX *= -1.05;
                ballSpeedY += random(-0.5, 0.5);
                ballX = 26;
                randomizeBallColor();
            }

            // Ütközés a második játékos ütőjével
            if (ballX >= width - 25 && ballX < width - 15 && ballY >= player2Y && ballY <= player2Y + 50) {
                ballSpeedX *= -1.05;
                ballSpeedY += random(-0.5, 0.5);
                ballX = width - 26;
                randomizeBallColor();
            }

            // Ütközés akadályokkal
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                if (ballX + 5 > obs.x - obs.width / 2 &&
                    ballX - 5 < obs.x + obs.width / 2 &&
                    ballY + 5 > obs.y - obs.height / 2 &&
                    ballY - 5 < obs.y + obs.height / 2) {
                    let overlapX = (ballX < obs.x) ? (ballX + 5) - (obs.x - obs.width / 2) : (obs.x + obs.width / 2) - (ballX - 5);
                    let overlapY = (ballY < obs.y) ? (ballY + 5) - (obs.y - obs.height / 2) : (obs.y + obs.height / 2) - (ballY - 5);

                    if (overlapX < overlapY) {
                        ballSpeedX *= -1;
                        ballX += (ballSpeedX > 0 ? overlapX : -overlapX);
                    } else {
                        ballSpeedY *= -1;
                        ballY += (ballSpeedY > 0 ? overlapY : -overlapY);
                    }
                    break;
                }
            }

            // Pontszám frissítése és játékmenet ellenőrzése
            if (ballX <= 0) {
                player2Score++;
                checkGameOver();
                if (!gameOver) resetBall();
            }
            if (ballX >= width) {
                player1Score++;
                checkGameOver();
                if (!gameOver) resetBall();
            }

            fill(ballColor);
            noStroke();
            ellipse(ballX, ballY, 10, 10);

            // Akadályok kirajzolása
            for (let obs of obstacles) {
                fill(139, 69, 19);
                noStroke();
                ellipse(obs.x, obs.y, obs.width, obs.height);
            }
        }

        function checkGameOver() {
            if (player1Score >= 3) {
                gameOver = true;
                winner = "Első Játékos ";
            } else if (player2Score >= 3) {
                gameOver = true;
                winner = "Második Játékos ";
            }

            if (gameOver) {
                const winnerMessage = document.getElementById('winnerMessage');
                const winnerText = document.getElementById('winnerText');
                const finalScore = document.getElementById('finalScore');

                winnerText.textContent = winner + " nyert!";
                finalScore.textContent = player1Score + ":" + player2Score;

                winnerMessage.style.display = 'block';
                playAgainDialog.style.display = 'block';
                noLoop();
            }
        }

        function resetGame() {
            player1Y = height / 2 - 25;
            player2Y = height / 2 - 25;
            player1Score = 0;
            player2Score = 0;
            gameOver = false;
            winner = "";
            obstacles = [];
            startTime = millis();
            lastSpeedIncrease = 0;
            resetBall();

            playAgainDialog.style.display = 'none';
            document.getElementById('winnerMessage').style.display = 'none';
        }

        function resetBall() {
            ballX = width / 2;
            ballY = height / 2;
            let angle = random([PI / 4, 3 * PI / 4, 5 * PI / 4, 7 * PI / 4]);
            ballSpeedX = 3 * cos(angle);
            ballSpeedY = 3 * sin(angle);
            randomizeBallColor();
        }

        function randomizeBallColor() {
            ballColor = color(random(255), random(255), random(255));
        }

        function manageObstacles() {
            let currentTime = millis();
            if (currentTime - lastObstacleChange > random(2000, 5000)) {
                // Véletlenszerű akadályok generálása
                if (random(1) < 0.6 && obstacles.length < maxObstacles) {
                    let newObstacle = {
                        x: random(width * 0.3, width * 0.7),
                        y: random(height * 0.2, height * 0.8),
                        width: 40,
                        height: 40
                    };
                    let distToCenter = dist(newObstacle.x, newObstacle.y, width / 2, height / 2);
                    if (distToCenter > 100) {
                        obstacles.push(newObstacle);
                    }
                } else if (obstacles.length > 0 && random(1) < 0.4) {
                    obstacles.splice(floor(random(obstacles.length)), 1);
                }
                lastObstacleChange = currentTime;
            }
        }

        yesButton.addEventListener('click', () => {
            playAgainDialog.style.display = 'none';
            resetGame();
            loop();
        });

        noButton.addEventListener('click', () => {
            playAgainDialog.style.display = 'none';
            window.close();
        });
    </script>
</body>
</html>
