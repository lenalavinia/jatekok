<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe játék</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            margin: 20px 0;
        }
        #game-board {
            display: inline-block;
            margin: 20px auto;
        }
        .row {
            display: flex;
        }
        .cell {
            width: 100px;
            height: 100px;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
        }
        #message {
            font-size: 20px;
            margin: 20px 0;
        }
        button {
            background-color: #3498db;
            border: none;
            padding: 15px 30px;
            margin: 10px auto;
            border-radius: 25px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            display: block;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background-color: #2ecc71;
        }
        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }
        button:hover::before {
            width: 300px;
            height: 300px;
        }
        .spinning-text {
            display: inline-block;
            transition: transform 0.3s ease;
        }
        button:hover .spinning-text {
            animation: spinX 1s infinite linear;
        }
        @keyframes spinX {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(360deg); }
        }

        /* Csak az elrendezést módosítjuk: vízszintes Igen/Nem */
        #restart-div {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #restart-div p {
            margin: 10px 0;
        }
        #restart-buttons {
            display: flex;
            gap: 20px;
        }
        #restart-buttons button {
            margin: 0;
            display: inline-block;
        }

        #soundToggle {
            padding: 5px 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <button id="soundToggle" onclick="toggleSound()"><span class="spinning-text">Hang bekapcsolása 🔊</span></button>
    <div id="game-board">
        <div class="row">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
        </div>
        <div class="row">
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
        </div>
        <div class="row">
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
    </div>
    <p id="message"></p>
    <button id="restart-button" onclick="restartGame()"><span class="spinning-text">Újra kezdés</span></button>

    <div id="restart-div">
        <p>Új játék?</p>
        <div id="restart-buttons">
            <button onclick="restartGame()">Igen</button>
            <button onclick="window.close()">Nem</button>
        </div>
    </div>

    <audio id="fanfare" src="fanfare.mp3"></audio>

    <script>
        let currentPlayer = 'X';
        let gameBoard = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;
        let soundEnabled = false;

        const cells = document.querySelectorAll('.cell');
        const message = document.getElementById('message');
        const restartDiv = document.getElementById('restart-div');
        const restartButton = document.getElementById('restart-button');
        const fanfare = document.getElementById('fanfare');
        const soundToggleButton = document.getElementById('soundToggle');

        cells.forEach(cell => {
            cell.addEventListener('click', () => {
                const index = cell.getAttribute('data-index');
                if (gameBoard[index] === '' && gameActive) {
                    gameBoard[index] = currentPlayer;
                    cell.textContent = currentPlayer;
                    checkWinner();
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                }
            });
        });

        function checkWinner() {
            const winningCombinations = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            for (let combo of winningCombinations) {
                const [a, b, c] = combo;
                if (gameBoard[a] && gameBoard[a] === gameBoard[b] && gameBoard[a] === gameBoard[c]) {
                    gameActive = false;
                    message.textContent = `${gameBoard[a]} nyert !!`;
                    if (soundEnabled) {
                        fanfare.play();
                    }
                    showRestartPrompt();
                    return;
                }
            }

            if (!gameBoard.includes('')) {
                gameActive = false;
                message.textContent = "Döntetlen !";
                showRestartPrompt();
            }
        }

        function showRestartPrompt() {
            restartButton.style.display = 'none';
            restartDiv.style.display = 'flex';
        }

        function restartGame() {
            gameBoard = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = 'X';
            message.textContent = '';
            cells.forEach(cell => cell.textContent = '');
            restartButton.style.display = 'block';
            restartDiv.style.display = 'none';
            fanfare.pause();
            fanfare.currentTime = 0;
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            soundToggleButton.innerHTML = `<span class="spinning-text">Hang ${soundEnabled ? 'kikapcsolása 🔇' : 'bekapcsolása 🔊'}</span>`;
        }
    </script>
</body>
</html>
