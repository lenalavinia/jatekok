<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dekázós Játék</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        canvas {
            border: 1px solid black;
            max-width: 90vw;
            max-height: 80vh;
            width: 100%;
            height: auto;
        }
        #score {
            font-size: 24px;
            margin: 10px;
            text-align: center;
        }
        #gameOver {
            font-size: 32px;
            color: red;
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #errorMessage {
            font-size: 20px;
            color: red;
            margin: 10px;
            text-align: center;
            display: none;
        }
        #playAgainDialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #333;
            color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
            z-index: 1000;
            text-align: center;
        }
        #playAgainDialog p {
            margin-bottom: 20px;
            font-size: 18px;
        }
        #playAgainDialog button {
            margin: 0 10px;
            padding: 8px 18px;
            font-size: 16px;
            cursor: pointer;
            background-color: #555;
            color: white;
            border: 1px solid #777;
            border-radius: 5px;
        }
        #playAgainDialog button:hover {
            background-color: #777;
        }
    </style>
</head>
<body>
    <div id="score">Érintések: 0<br>Rekord: 0 - Nincs</div>
    <div id="errorMessage"></div>
    <canvas id="gameCanvas"></canvas>
    <div id="gameOver">Játék Vége!</div>
    <div id="playAgainDialog">
        <p id="gameOverMessage">Játék Vége!</p>
        <p>Új játék?</p>
        <button id="yesButton">Új játék</button>
        <button id="noButton">Kilépés</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const gameOverDisplay = document.getElementById('gameOver');
        const errorMessage = document.getElementById('errorMessage');
        const playAgainDialog = document.getElementById('playAgainDialog');
        const gameOverMessageElement = document.getElementById('gameOverMessage');
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');

        // Képek betöltése
        const ballImg = new Image();
        ballImg.crossOrigin = "Anonymous";
        ballImg.src = 'labda_png.png';
        const shoeImg = new Image();
        shoeImg.crossOrigin = "Anonymous";
        shoeImg.src = 'cipo_png.png';

        // Képek betöltésének ellenőrzése
        let ballImageLoaded = false;
        let shoeImageLoaded = false;
        let errorLoadingImages = false;
        let usePixelCollision = true;

        ballImg.onload = () => {
            ballImageLoaded = true;
            checkImagesLoaded();
        };
        shoeImg.onload = () => {
            shoeImageLoaded = true;
            checkImagesLoaded();
        };
        ballImg.onerror = () => {
            console.error("Nem sikerült betölteni a labda képét: labda_png.png");
            errorMessage.textContent = "Nem sikerült betölteni a képeket, helyettesítő grafikák használata.";
            errorMessage.style.display = 'block';
            ballImageLoaded = true;
            errorLoadingImages = true;
            checkImagesLoaded();
        };
        shoeImg.onerror = () => {
            console.error("Nem sikerült betölteni a cipő képét: cipo_png.png");
            errorMessage.textContent = "Nem sikerült betölteni a képeket, helyettesítő grafikák használata.";
            errorMessage.style.display = 'block';
            shoeImageLoaded = true;
            errorLoadingImages = true;
            checkImagesLoaded();
        };

        // Vászon méretezés
        function resizeCanvas() {
            const maxWidth = window.innerWidth * 0.9;
            const maxHeight = window.innerHeight * 0.8;
            const aspectRatio = 1920 / 1080;
            let newWidth = maxWidth;
            let newHeight = newWidth / aspectRatio;

            if (newHeight > maxHeight) {
                newHeight = maxHeight;
                newWidth = newHeight * aspectRatio;
            }

            canvas.width = newWidth;
            canvas.height = newHeight;
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeCanvas, 100);
        });
        resizeCanvas();

        // Játék változók (relatív méretek a vászonhoz)
        let ball = {
            x: canvas.width / 2,
            y: canvas.height / 10.8,
            radius: canvas.width / 38.4,
            dx: 0,
            dy: 0,
            gravity: 1.5 // Gravitáció növelése
        };
        let shoe = {
            x: canvas.width / 2,
            y: canvas.height * 0.833,
            width: canvas.width / 9.6,
            height: canvas.height / 10.8,
            speed: 3.1
        };
        const shoeCollisionHeight = shoe.height * 0.6;
        const maxSpeed = 20;
        let score = 0;
        let highScore = localStorage.getItem('dekaHighScore') ? parseInt(localStorage.getItem('dekaHighScore')) : 0;
        let highScoreName = localStorage.getItem('dekaHighScoreName') || 'Nincs';
        let gameOver = false;
        let paused = false;
        let isColliding = false;
        let speedMultiplier = 1;
        let gameStartTime = Date.now();

        // Egér pozíció és mozgás figyelése
        let mouseX = shoe.x;
        let mouseY = shoe.y;
        let lastMouseX = mouseX;

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            lastMouseX = mouseX;
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        // Space gomb szüneteltetés/continuálás
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !gameOver) {
                paused = !paused;
                if (paused) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = 'white';
                    ctx.font = `${24 * (canvas.width / 1920)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText('Szünet', canvas.width / 2, canvas.height / 2);
                } else {
                    gameStartTime = Date.now() - (Date.now() - gameStartTime);
                    requestAnimationFrame(gameLoop);
                }
            }
            if (playAgainDialog.style.display === 'block') {
                if (e.key === 'Enter' || e.key === 'y' || e.key === 'Y') yesButton.click();
                else if (e.key === 'Escape' || e.key === 'n' || e.key === 'N') noButton.click();
            }
        });

        // Sebességnövekedés időzítő
        function updateSpeedMultiplier() {
            const elapsedTime = (Date.now() - gameStartTime) / 1000;
            const minutes = Math.floor(elapsedTime / 60);
            speedMultiplier = 1 + minutes * 0.1;
        }

        // Pixel-alapú ütközésérzékelés
        function detectPixelCollision() {
            try {
                const overlapLeft = Math.max(ball.x - ball.radius, shoe.x);
                const overlapRight = Math.min(ball.x + ball.radius, shoe.x + shoe.width);
                const overlapTop = Math.max(ball.y - ball.radius, shoe.y);
                const overlapBottom = Math.min(ball.y + ball.radius, shoe.y + shoe.height);

                if (overlapLeft >= overlapRight || overlapTop >= overlapBottom) {
                    return false;
                }

                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;

                tempCtx.drawImage(ballImg, ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);
                const ballData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height).data;

                tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);

                tempCtx.drawImage(shoeImg, shoe.x, shoe.y, shoe.width, shoe.height);
                const shoeData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height).data;

                const hasPassedThrough = ball.y + ball.radius > shoe.y + shoeCollisionHeight && ball.x >= shoe.x && ball.x <= shoe.x + shoe.width;

                for (let y = overlapTop; y < overlapBottom; y++) {
                    for (let x = overlapLeft; x < overlapRight; x++) {
                        const idx = (Math.floor(y) * tempCanvas.width + Math.floor(x)) * 4;
                        const ballAlpha = ballData[idx + 3];
                        const shoeAlpha = shoeData[idx + 3];
                        if (ballAlpha > 0 && shoeAlpha > 0) {
                            if (hasPassedThrough) {
                                ball.y = shoe.y + shoeCollisionHeight - ball.radius;
                            }
                            return true;
                        }
                    }
                }
                return false;
            } catch (e) {
                console.error("Hiba a pixel-alapú ütközésérzékelés során:", e);
                errorMessage.textContent = "Pixel-alapú ütközésérzékelés nem működik, geometriai közelítés használata.";
                errorMessage.style.display = 'block';
                usePixelCollision = false;
                return false;
            }
        }

        // Geometriai ütközésérzékelés
        function detectGeometricCollision() {
            const closestX = Math.max(shoe.x, Math.min(ball.x, shoe.x + shoe.width));
            const closestY = Math.max(shoe.y, Math.min(ball.y, shoe.y + shoeCollisionHeight));
            const distanceX = ball.x - closestX;
            const distanceY = ball.y - closestY;
            const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);
            const minBounceSpeed = 1;

            const isInCollisionZone = distance <= ball.radius && ball.dy > 0 && ball.y + ball.radius >= shoe.y;
            const hasPassedThrough = ball.y + ball.radius > shoe.y + shoeCollisionHeight && ball.x >= shoe.x && ball.x <= shoe.x + shoe.width && distance <= ball.radius;

            if ((isInCollisionZone || hasPassedThrough) && !isColliding && Math.abs(ball.dy) > minBounceSpeed) {
                if (hasPassedThrough) {
                    ball.y = shoe.y + shoeCollisionHeight - ball.radius;
                }
                return true;
            }
            return false;
        }

        // Ütközés detektálása
        function detectCollision() {
            const isNearShoe = ball.y + ball.radius >= shoe.y && ball.x >= shoe.x - ball.radius && ball.x <= shoe.x + shoe.width + ball.radius;
            let collisionDetected = false;

            if (isNearShoe) {
                if (usePixelCollision) {
                    collisionDetected = detectPixelCollision();
                } else {
                    collisionDetected = detectGeometricCollision();
                }
            }

            if (collisionDetected && !isColliding) {
                isColliding = true;

                score++;
                updateScoreDisplay();

                const relativeX = ball.x - (shoe.x + shoe.width / 2);
                const maxBounceAngle = Math.PI / 6;
                const bounceAngle = (relativeX / (shoe.width / 2)) * maxBounceAngle;

                let speed = Math.max(Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy), 15); // Minimális sebesség növelése
                speed *= speedMultiplier;
                speed = Math.min(speed, maxSpeed);
                ball.dy = -speed * Math.cos(bounceAngle) * 0.98; // Súrlódás csökkentése
                ball.dx = speed * Math.sin(bounceAngle) * 0.98;

                // Biztosítjuk, hogy a labda ne ragadjon a cipőhöz
                if (Math.abs(ball.dy) < 5) {
                    ball.dy = -10; // Erős felfelé impulzus
                }
            } else if (ball.y + ball.radius < shoe.y - 5) { // Kis távolság a cipőtől, hogy biztosan visszaálljon
                isColliding = false;
            }
        }

        // Pontszám és rekord frissítése
        function updateScoreDisplay() {
            scoreDisplay.innerHTML = `Érintések: ${score}<br>Rekord: ${highScore} - ${highScoreName}`;
        }

        // Játék visszaállítása
        function resetGame() {
            score = 0;
            ball = {
                x: canvas.width / 2,
                y: canvas.height / 10.8,
                radius: canvas.width / 38.4,
                dx: 0,
                dy: 0,
                gravity: 1.5
            };
            shoe = {
                x: canvas.width / 2,
                y: canvas.height * 0.833,
                width: canvas.width / 9.6,
                height: canvas.height / 10.8,
                speed: 3.1
            };
            gameOver = false;
            paused = false;
            isColliding = false;
            speedMultiplier = 1;
            gameStartTime = Date.now();
            playAgainDialog.style.display = 'none';
            gameOverDisplay.style.display = 'none';
            updateScoreDisplay();
            gameLoop();
        }

        // Játék vége
        function endGame() {
            gameOver = true;
            let message = `Játék Vége! Pontszámod: ${score}.`;
            if (score > highScore) {
                let playerName = prompt(`Új rekord: ${score}!\nAdd meg a neved:`, highScoreName !== 'Nincs' ? highScoreName : "");
                if (playerName !== null) {
                    playerName = playerName.trim();
                    const nameToSave = playerName || "Névtelen";
                    highScore = score;
                    highScoreName = nameToSave;
                    localStorage.setItem('dekaHighScore', highScore);
                    localStorage.setItem('dekaHighScoreName', highScoreName);
                    message = `Új rekord: ${score} (${highScoreName})!`;
                } else {
                    message = `Játék Vége! Pontszámod: ${score}. Rekord: ${highScore} (${highScoreName}).`;
                }
            } else {
                message = `Játék Vége! Pontszámod: ${score}. Rekord: ${highScore} (${highScoreName}).`;
            }

            gameOverMessageElement.textContent = message.split('.')[0] + '!';
            playAgainDialog.style.display = 'block';
        }

        // Játék ciklus
        function gameLoop() {
            if (gameOver || paused) {
                if (gameOver) endGame();
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Cipő mozgása simítva
            const lerpFactor = 0.1;
            const targetX = mouseX - shoe.width / 2;
            const targetY = mouseY - shoe.height / 2;
            const boundedTargetX = Math.max(0, Math.min(targetX, canvas.width - shoe.width));
            const boundedTargetY = Math.max(0, Math.min(targetY, canvas.height - shoe.height));
            shoe.x += (boundedTargetX - shoe.x) * lerpFactor;
            shoe.y += (boundedTargetY - shoe.y) * lerpFactor;

            ball.dy += ball.gravity;

            ball.x += ball.dx;
            ball.y += ball.dy;

            ball.dx = Math.min(Math.max(ball.dx, -maxSpeed), maxSpeed);
            ball.dy = Math.min(Math.max(ball.dy, -maxSpeed), maxSpeed);

            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.dx = Math.abs(ball.dx);
            }
            if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.dx = -Math.abs(ball.dx);
            }
            if (ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.dy = Math.abs(ball.dy);
            }
            if (ball.y + ball.radius > canvas.height) {
                gameOver = true;
            }

            updateSpeedMultiplier();
            detectCollision();

            if (!errorLoadingImages && ballImageLoaded && ballImg.complete && ballImg.naturalWidth !== 0) {
                ctx.drawImage(ballImg, ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);
            } else {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'yellow';
                ctx.fill();
                ctx.closePath();
            }

            if (!errorLoadingImages && shoeImageLoaded && shoeImg.complete && shoeImg.naturalWidth !== 0) {
                ctx.drawImage(shoeImg, shoe.x, shoe.y, shoe.width, shoe.height);
            } else {
                ctx.fillStyle = 'black';
                ctx.fillRect(shoe.x, shoe.y, shoe.width, shoe.height);
            }

            requestAnimationFrame(gameLoop);
        }

        // Képek betöltésének ellenőrzése
        function checkImagesLoaded() {
            if (ballImageLoaded && shoeImageLoaded) {
                updateScoreDisplay();
                gameLoop();
            }
        }

        // Dialog gombok eseménykezelői
        yesButton.addEventListener('click', resetGame);
        noButton.addEventListener('click', () => {
            playAgainDialog.style.display = 'none';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = `${24 * (canvas.width / 1920)}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText('Köszönjük, hogy játszottál!', canvas.width / 2, canvas.height / 2 - 20);
            ctx.font = `${16 * (canvas.width / 1920)}px Arial`;
            ctx.fillText('Frissítsd az oldalt az új játékhoz.', canvas.width / 2, canvas.height / 2 + 20);
        });
    </script>
</body>
</html>
