<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Őrült Kerék Társasjáték - módosított</title>
  <style>
    body { 
      background-color: #f3f4f6; 
      font-family: Arial, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 0; 
      position: relative; 
      overflow: hidden;
    }
    h1 { margin-bottom: 20px; }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(10, minmax(0, 1fr)); 
      gap: 2px; 
    }
    .board-cell { 
      width: 3rem; 
      height: 3rem; 
      border: 1px solid #000; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-size: 0.8rem; 
      position: relative; 
      background-color: #fff; 
      overflow: visible; 
    }
    .special-cell { 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .swap-cell {
      background-image: url('csere.jpg');
      background-size: cover;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stop-cell {
      background-image: url('stop_png.png');
      background-size: cover;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .player-piece { 
      width: 1.5rem; 
      height: 1.5rem; 
      border-radius: 50%; 
      border: 1px solid black; 
    }
    .board-player-piece { 
      width: 1rem; 
      height: 1rem; 
      border-radius: 50%; 
      border: 1px solid black; 
      position: absolute; 
    }
    .player-indicator {
      display: inline-block;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      border: 1px solid black;
      margin-left: 5px;
      vertical-align: middle;
    }
    #rollButton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      pointer-events: auto;
    }
    #rollButton .spinning-text {
      display: flex;
      align-items: center;
    }
    #playerSetup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .die {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      background: #fff;
      border: 2px solid #000;
      border-radius: 5px;
      margin: 0;
      position: relative;
    }
    .dot { 
      width: 10px; 
      height: 10px; 
      background: black; 
      border-radius: 50%; 
      position: absolute; 
    }
    .die[data-value="1"] .dot:nth-child(1) { top: 20px; left: 20px; }
    .die[data-value="2"] .dot:nth-child(1) { top: 10px; left: 10px; }
    .die[data-value="2"] .dot:nth-child(2) { bottom: 10px; right: 10px; }
    .die[data-value="3"] .dot:nth-child(1) { top: 10px; left: 10px; }
    .die[data-value="3"] .dot:nth-child(2) { top: 20px; left: 20px; }
    .die[data-value="3"] .dot:nth-child(3) { bottom: 10px; right: 10px; }
    .die[data-value="4"] .dot:nth-child(1) { top: 10px; left: 10px; }
    .die[data-value="4"] .dot:nth-child(2) { top: 10px; right: 10px; }
    .die[data-value="4"] .dot:nth-child(3) { bottom: 10px; left: 10px; }
    .die[data-value="4"] .dot:nth-child(4) { bottom: 10px; right: 10px; }
    .die[data-value="5"] .dot:nth-child(1) { top: 10px; left: 10px; }
    .die[data-value="5"] .dot:nth-child(2) { top: 10px; right: 10px; }
    .die[data-value="5"] .dot:nth-child(3) { top: 20px; left: 20px; }
    .die[data-value="5"] .dot:nth-child(4) { bottom: 10px; left: 10px; }
    .die[data-value="5"] .dot:nth-child(5) { bottom: 10px; right: 10px; }
    .die[data-value="6"] .dot:nth-child(1) { top: 10px; left: 10px; }
    .die[data-value="6"] .dot:nth-child(2) { top: 10px; right: 10px; }
    .die[data-value="6"] .dot:nth-child(3) { top: 20px; left: 10px; }
    .die[data-value="6"] .dot:nth-child(4) { top: 20px; right: 10px; }
    .die[data-value="6"] .dot:nth-child(5) { bottom: 10px; left: 10px; }
    .die[data-value="6"] .dot:nth-child(6) { bottom: 10px; right: 10px; }
    #diceDisplay {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-top: 10px;
    }
    #controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      text-align: center;
    }
    #rollButton, #startButton {
      background-color: #3498db;
      border: none;
      padding: 15px 30px;
      margin: 10px 0;
      border-radius: 25px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }
    #rollButton:hover, #startButton:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      background-color: #2ecc71;
    }
    #rollButton::before, #startButton::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
    }
    #rollButton:hover::before, #startButton:hover::before {
      width: 300px;
      height: 300px;
    }
    #rollButton .spinning-text, #startButton .spinning-text {
      display: inline-block;
      transition: transform 0.3s ease;
    }
    #rollButton:hover .spinning-text, #startButton:hover .spinning-text {
      animation: spinX 1s infinite linear;
    }
    @keyframes spinX {
      to { transform: rotateX(360deg); }
    }
    #numberDraw {
      background-color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .wheel-container {
      position: relative;
      width: 90vmin;
      height: 90vmin;
      align-items: center;
      justify-content: center;
    }
    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 10px solid #888;
      position: relative;
      transition: transform 5s cubic-bezier(0.25, 1, 0.25, 1);
      background: conic-gradient(
        #ff4d4d, #4d79ff, #4dff4d, #ffcc4d, #cc4dff,
        #ff4d4d, #4d79ff, #4dff4d, #ffcc4d, #cc4dff,
        #ff4d4d
      );
    }
    .number {
      position: absolute;
      text-align: center;
      font-size: 1.8vmin;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 5px #000, 0 0 10px #000;
      transform: translate(-50%, -50%);
      pointer-events: none;
      border: 1px solid red;
    }
    #pointer {
      width: 0;
      height: 0;
      border-left: 30px solid transparent;
      border-right: 30px solid transparent;
      border-top: 50px solid #ff3333;
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    #result {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4vmin;
      font-weight: bold;
      color: white;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      z-index: 20;
      pointer-events: none;
    }
    .arrow-icon {
      width: 2.25rem;
      height: 2.25rem;
      display: inline-block;
    }
    .arrow-icon svg {
      width: 100%;
      height: 100%;
    }
    .arrow-icon path {
      fill: white;
    }
    .arrow-up path {
      fill: #00ff00;
    }
    .arrow-down path {
      fill: #ff5555;
    }
    .sound-toggle {
      background-color: #3498db;
      border: none;
      padding: 10px 20px;
      margin: 10px 0;
      border-radius: 25px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      position: absolute;
      top: -60px;
      right: 15px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .sound-toggle:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      background-color: #2ecc71;
    }
    .sound-toggle::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
    }
    .sound-toggle:hover::before {
      width: 200px;
      height: 200px;
    }
    .sound-toggle .spinning-text {
      display: inline-block;
      transition: transform 0.3s ease;
    }
    .sound-toggle:hover .spinning-text {
      animation: spinX 1s infinite linear;
    }
    .swap-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 1.5rem;
      text-align: center;
      z-index: 1000;
      display: none;
    }
    #newGameDialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #fff;
      padding: 20px;
      border: 2px solid #000;
      border-radius: 10px;
      z-index: 1000;
      text-align: center;
      display: none;
    }
    #newGameDialog p {
      margin: 10px 0;
      font-size: 20px;
    }
    #newGameDialog .button-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 20px;
    }
    #newGameDialog button {
      background-color: #3498db;
      border: none;
      padding: 15px 30px;
      border-radius: 25px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
      display: inline-block;
    }
    #newGameDialog button:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      background-color: #2ecc71;
    }
    #newGameDialog button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
    }
    #newGameDialog button:hover::before {
      width: 300px;
      height: 300px;
    }
    #newGameDialog button .spinning-text {
      display: inline-block;
      transition: transform 0.3s ease;
    }
    #newGameDialog button:hover .spinning-text {
      animation: spinX 1s infinite linear;
    }
    .player-name {
      cursor: pointer;
    }
    #nameChangeDialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #fff;
      padding: 20px;
      border: 2px solid #000;
      border-radius: 10px;
      z-index: 1000;
      text-align: center;
      display: none;
    }
    #nameChangeDialog input {
      margin: 10px 0;
      padding: 5px;
      width: 200px;
    }
    #nameChangeDialog button {
      background-color: #3498db;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      margin: 0 5px;
    }
    #nameChangeDialog button:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      background-color: #2ecc71;
    }
    #stopAnimation {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #f3f4f6;
      z-index: 1000;
    }
    #stopSign {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: transform 2s;
      width: 33%;
      height: auto;
    }
    #textOverlay {
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 24px;
      font-family: Arial, sans-serif;
      text-align: center;
      width: 100%;
      opacity: 0;
      transition: opacity 0.5s;
    }
    #roundDisplay {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div id="gameContent">
    <div id="playerSetup">
      <label>Játékosok száma: </label>
      <select id="playerCount">
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
      <button id="startButton" onclick="startGame()"><span class="spinning-text">Játék indítása</span></button>
    </div>
    <div id="roundDisplay" style="display: none;"></div>
    <div id="playerList" style="margin: 20px 0;"></div>
    <div id="gameBoardWrapper" style="position: relative; width: 100%; display: flex; justify-content: center;">
      <div id="gameBoard" class="grid" style="display: none; position: relative; margin-top: 20px;"></div>
      <button class="sound-toggle" onclick="toggleSound()" id="soundToggleBtn" style="display: none;">
        <span class="spinning-text" id="soundText">Hang bekapcsolása 🔊</span>
      </button>
    </div>
    <div id="controls" style="display: none;">
      <button id="rollButton" onclick="rollDice()"><span class="spinning-text" id="rollButtonText">Kocka dobása</span></button>
      <div id="diceDisplay"></div>
    </div>
  </div>

  <div id="numberDraw" style="display: none;">
    <div class="wheel-container">
      <div id="pointer"></div>
      <div class="wheel" id="wheel"></div>
      <div id="result"></div>
    </div>
  </div>

  <div id="swapMessage" class="swap-message"></div>

  <div id="stopAnimation" style="display: none;">
    <img id="stopSign" src="stop_png.png" alt="Stop tábla">
    <div id="textOverlay"></div>
  </div>

  <div id="newGameDialog">
    <p id="winnerMessage"></p>
    <p>Új játék?</p>
    <div class="button-container">
      <button onclick="handleNewGame(true)"><span class="spinning-text">Igen</span></button>
      <button onclick="handleNewGame(false)"><span class="spinning-text">Nem</span></button>
    </div>
  </div>

  <div id="nameChangeDialog">
    <p>Új név megadása</p>
    <input type="text" id="newPlayerName" placeholder="Add meg az új nevet" onkeypress="if(event.key === 'Enter') saveNameChange()" />
    <button onclick="saveNameChange()">Mentés</button>
    <button onclick="closeNameChangeDialog()">Mégse</button>
  </div>

  <script>
    // Játék állapota
    let players = [], currentPlayer = 0, gameStarted = false, currentRound = 1;
    let specialFields = []; // szerencse kerék mezők (kerek)
    let swapFields = [];    // csere mezők
    let stopFields = [];    // stop mezők (csak játék elején)
    let skipNextTurn = {};
    let playersSeenThisRound = new Set();
    let drawnNumber = null;
    let gameState = null;
    let originalGameContent = null;
    let diceSound = new Audio('dobas_hang.mp3');
    let spinSound = new Audio('kerekhang.mp3');
    let swapSound = new Audio('csere.mp3');
    let fanfareSound = new Audio('fanfare.mp3');
    let upSound = new Audio('fel.mp3');
    let downSound = new Audio('le.mp3');
    let stopSound = new Audio('stop.mp3');
    let soundEnabled = false;
    let rollDisabled = false;

    // Ha nincsenek fájlok, csak figyelmeztetünk a konzolra
    diceSound.onerror = () => console.warn('Dice sound file not found, sound disabled.');
    spinSound.onerror = () => console.warn('Spin sound file not found, sound disabled.');
    swapSound.onerror = () => console.warn('Swap sound file not found, sound disabled.');
    fanfareSound.onerror = () => console.warn('Fanfare sound file not found, sound disabled.');
    upSound.onerror = () => console.warn('Up sound file (fel.mp3) not found, sound disabled.');
    downSound.onerror = () => console.warn('Down sound file (le.mp3) not found, sound disabled.');
    stopSound.onerror = () => console.warn('Stop sound file (stop.mp3) not found, sound disabled.');
    if (diceSound.error || spinSound.error || swapSound.error || fanfareSound.error || upSound.error || downSound.error || stopSound.error) soundEnabled = false;

    // Segédfüggvény: biztonságosan választ véletlen mezőket a megadott számig,
    // figyelembe véve a kizárt mezőket, tiltást 100-ra és a elfoglalt mezőkre.
    function pickUniqueFields(count, excludedSet) {
      const result = [];
      const taken = new Set(excludedSet); // már foglaltak
      // Lehetőségek: 1..99 (tiltjuk 100)
      const options = [];
      for (let i = 2; i <= 99; i++) { // 1 maradhat kezdőhely, 100 tiltva
        if (!taken.has(i)) options.push(i);
      }
      // Ha nem elég opció van, visszaadjuk, amennyi lehetséges
      while (result.length < count && options.length > 0) {
        const idx = Math.floor(Math.random() * options.length);
        result.push(options[idx]);
        options.splice(idx, 1);
      }
      return result;
    }

    // Stop mezők csak egyszer, a játék indításakor
    function assignStopFields() {
      stopFields = [];
      const taken = new Set(players.map(p => p.position));
      // Stop mezők száma (tetszőleges) - eredetileg 10 volt
      stopFields = pickUniqueFields(10, new Set([...taken]));
      console.log('assignStopFields:', stopFields);
    }

    // Szerencse-kerék mezők (specialFields) és csere mezők (swapFields)
    // csak anélkül, hogy 100-ra, vagy már foglalt mezőre essenek,
    // továbbá nem ütközhetnek a stop mezőkkel és egymással.
    function assignSpecialFields() {
      // kizárások: játékosok pozíciói, stop mezők, és swap mezők (ha már vannak)
      const excluded = new Set([...players.map(p => p.position), ...stopFields, ...swapFields]);
      specialFields = pickUniqueFields(10, excluded);
      console.log('assignSpecialFields (új):', specialFields);
    }

    function assignSwapFields() {
      const excluded = new Set([...players.map(p => p.position), ...stopFields, ...specialFields]);
      swapFields = pickUniqueFields(10, excluded);
      console.log('assignSwapFields (új):', swapFields);
    }

    // Render board és játékos lista
    function renderBoard() {
      const board = document.getElementById('gameBoard');
      board.innerHTML = '';
      // 100-tól 1-ig, hogy ugyanúgy nézzen ki, mint eredetiben
      for (let i = 100; i >= 1; i--) {
        const cell = document.createElement('div');
        cell.className = 'board-cell';
        cell.innerText = i;
        if (specialFields.includes(i)) {
          cell.classList.add('special-cell');
          const icon = document.createElement('img');
          icon.src = 'kerek.png';
          icon.style.width = '24px';
          icon.style.height = '24px';
          cell.appendChild(icon);
        } else if (swapFields.includes(i)) {
          cell.classList.add('swap-cell');
        } else if (stopFields.includes(i)) {
          cell.classList.add('stop-cell');
        }
        const playersOnCell = players.filter(p => p.position === i);
        playersOnCell.forEach((p, index) => {
          const piece = document.createElement('div');
          piece.className = 'board-player-piece';
          piece.style.backgroundColor = p.color;
          // eltolás, hogy több figura látszódjon
          piece.style.left = `${6 + index * 10}%`;
          piece.style.top = `${6 + (index % 2) * 40}%`;
          cell.appendChild(piece);
        });
        board.appendChild(cell);
      }
    }

    function renderPlayerList() {
      const list = document.getElementById('playerList');
      const roundDisplay = document.getElementById('roundDisplay');
      roundDisplay.textContent = `Aktuális kör: ${currentRound}`;
      list.innerHTML = '';
      players.forEach((p, idx) => {
        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.alignItems = 'center';
        row.style.gap = '0.5rem';
        const mark = document.createElement('div');
        mark.className = 'player-indicator';
        mark.style.backgroundColor = p.color;
        const span = document.createElement('span');
        span.className = 'player-name';
        span.innerText = `${p.name} - mező: ${p.position}${skipNextTurn[p.color] ? ` (kihagyja a következő körét)` : ''}`;
        span.style.fontWeight = idx === currentPlayer ? 'bold' : 'normal';
        span.onclick = () => openNameChangeDialog(p.id - 1);
        row.appendChild(mark);
        row.appendChild(span);
        list.appendChild(row);
      });
      updateRollButton();
    }

    function openNameChangeDialog(playerIndex) {
      const dialog = document.getElementById('nameChangeDialog');
      document.getElementById('newPlayerName').value = '';
      dialog.dataset.playerIndex = playerIndex;
      dialog.style.display = 'block';
      setTimeout(() => {
        document.getElementById('newPlayerName').focus();
      }, 0);
    }

    function closeNameChangeDialog() {
      const dialog = document.getElementById('nameChangeDialog');
      dialog.style.display = 'none';
    }

    function saveNameChange() {
      const dialog = document.getElementById('nameChangeDialog');
      const playerIndex = dialog.dataset.playerIndex;
      const newName = document.getElementById('newPlayerName').value.trim();
      if (newName) {
        players[playerIndex].name = newName;
        renderPlayerList();
      }
      closeNameChangeDialog();
    }

    function updateRollButton() {
      const rollButton = document.getElementById('rollButton');
      const rollButtonText = document.getElementById('rollButtonText');
      const current = players[currentPlayer];
      if (!current || rollDisabled || skipNextTurn[current.color]) {
        rollButtonText.innerHTML = 'Kocka dobása';
        rollButton.style.pointerEvents = 'none';
        rollButton.style.opacity = '0.5';
      } else {
        rollButtonText.innerHTML = `Kocka dobása <span class="player-indicator" style="background-color: ${current.color};"></span>`;
        rollButton.style.pointerEvents = 'auto';
        rollButton.style.opacity = '1';
      }
    }

    // Kezdő/follow up logika: ki következik
    function beginTurnAt(startIndex) {
      if (!players || players.length === 0) return;
      let idx = startIndex % players.length;
      let attempts = 0;
      while (attempts < players.length) {
        if (playersSeenThisRound.size >= players.length) {
          currentRound++;
          playersSeenThisRound.clear();
          console.log(`Új kör kezdődik: ${currentRound}`);
        }

        if (skipNextTurn[players[idx].color]) {
          console.log(`beginTurnAt: ${players[idx].name} kihagyja a körét (skip), index: ${idx}`);
          playersSeenThisRound.add(idx);
          skipNextTurn[players[idx].color] = false;
          idx = (idx + 1) % players.length;
          attempts++;
          continue;
        }

        if (!playersSeenThisRound.has(idx)) {
          currentPlayer = idx;
          playersSeenThisRound.add(idx);
          renderPlayerList();
          updateRollButton();
          console.log(`beginTurnAt: Következő játékos: ${players[currentPlayer].name} (index: ${currentPlayer}), kör: ${currentRound}`);
          return;
        }

        idx = (idx + 1) % players.length;
        attempts++;
      }

      currentRound++;
      playersSeenThisRound.clear();
      for (let i = 0; i < players.length; i++) {
        if (!skipNextTurn[players[i].color]) {
          currentPlayer = i;
          playersSeenThisRound.add(i);
          renderPlayerList();
          updateRollButton();
          return;
        } else {
          playersSeenThisRound.add(i);
          skipNextTurn[players[i].color] = false;
        }
      }
    }

    // --- start / new game ---
    function startGame() {
      const cnt = parseInt(document.getElementById('playerCount').value);
      players = [];
      skipNextTurn = {};
      playersSeenThisRound = new Set();
      const colors = ['red', 'yellow', 'blue', 'green'];
      for (let i = 0; i < cnt; i++) {
        players.push({ id: i + 1, position: 1, color: colors[i], name: `${colors[i]} játékos` });
        skipNextTurn[colors[i]] = false;
      }
      currentPlayer = 0;
      currentRound = 1;
      gameStarted = true;

      // stop mezők csak egyszer, játék elején
      assignStopFields();

      // Az első dobás előtt (még a játék elindításakor) legyenek ismertek a kerek és csere mezők
      assignSpecialFields();
      assignSwapFields();

      document.getElementById('playerSetup').style.display = 'none';
      document.getElementById('gameBoardWrapper').style.display = 'flex';
      document.getElementById('gameBoard').style.display = 'grid';
      document.getElementById('controls').style.display = 'flex';
      document.getElementById('soundToggleBtn').style.display = 'flex';
      document.getElementById('diceDisplay').style.display = 'none';
      document.getElementById('roundDisplay').style.display = 'block';
      renderBoard();
      renderPlayerList();
      beginTurnAt(0);
      originalGameContent = document.getElementById('gameContent').innerHTML;
      console.log(`startGame: Játék elkezdve ${cnt} játékossal, aktuális játékos: ${players[currentPlayer].name}, kör: ${currentRound}`);
    }

    function newGame() {
      // visszaállítás — NEM sorsolunk újra semmit automatikusan, amíg újra nem indítják a játékot
      players = [];
      currentPlayer = 0;
      currentRound = 1;
      gameStarted = false;
      specialFields = [];
      swapFields = [];
      stopFields = [];
      skipNextTurn = {};
      playersSeenThisRound = new Set();
      drawnNumber = null;
      soundEnabled = false;
      rollDisabled = false;
      document.getElementById('soundText').textContent = 'Hang bekapcsolása 🔊';
      document.getElementById('gameContent').innerHTML = originalGameContent;
      document.getElementById('gameBoardWrapper').style.display = 'none';
      document.getElementById('gameBoard').style.display = 'none';
      document.getElementById('controls').style.display = 'none';
      document.getElementById('soundToggleBtn').style.display = 'none';
      document.getElementById('playerList').innerHTML = '';
      document.getElementById('swapMessage').style.display = 'none';
      document.getElementById('stopAnimation').style.display = 'none';
      document.getElementById('roundDisplay').style.display = 'none';
      document.getElementById('playerSetup').style.display = 'flex';
      console.log('newGame: Játék visszaállítva (nem sorsoltam új mezőket)');
    }

    // --- dobás / kockadobás ---
    function updateDie(die, val) {
      die.innerHTML = '';
      die.setAttribute('data-value', val);
      for (let i = 0; i < val; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        die.appendChild(dot);
      }
    }

    function rollDice() {
      if (!gameStarted || rollDisabled || skipNextTurn[players[currentPlayer].color]) return;
      const current = players[currentPlayer];
      console.log(`rollDice: Játékos ${current.name} (szín: ${current.color}, id: ${current.id}), kör: ${currentRound}`);

      if (soundEnabled && diceSound) {
        diceSound.currentTime = 0;
        diceSound.play().catch(() => console.warn('Dice sound playback failed.'));
      }
      const dd = document.getElementById('diceDisplay');
      dd.style.display = 'block';
      dd.innerHTML = '<div class="die" id="die1"></div>';
      const die = document.getElementById('die1');
      let cnt = 0;
      const iv = setInterval(() => {
        const v = Math.floor(Math.random() * 6) + 1;
        updateDie(die, v);
        cnt++;
        if (cnt >= 10) {
          clearInterval(iv);
          finishRoll();
        }
      }, 100);

      const pIndex = currentPlayer;
      async function finishRoll() {
        const roll = Math.floor(Math.random() * 6) + 1;
        updateDie(die, roll);

        const p = players[pIndex];
        let newPos = p.position + roll;
        if (newPos > 100) newPos = 100 - (newPos - 100);
        console.log(`finishRoll: Játékos ${p.name} (szín: ${p.color}, id: ${p.id}), dobás: ${roll}, régi pozíció: ${p.position}, új pozíció: ${newPos}`);
        p.position = newPos;

        renderBoard();
        renderPlayerList();

        if (p.position === 100) {
          const winner = `${p.name} nyert!`;
          showNewGameDialog(winner);
          return;
        }

        if (stopFields.includes(newPos)) {
          // stop mező már csak a játék elején lett sorsolva, itt csak alkalmazzuk
          skipNextTurn[p.color] = true;
          showStopAnimation(p.color, () => {
            // Újrasorsolás a lépés után
            assignSpecialFields();
            assignSwapFields();
            renderBoard();
            beginTurnAt((pIndex + 1) % players.length);
            renderBoard();
            renderPlayerList();
            console.log(`finishRoll: Stop mező eltalálva, következő játékos: ${players[currentPlayer].name}, kör: ${currentRound}`);
          });
        } else if (swapFields.includes(newPos)) {
          // csere mezőt eltalált: véletlenszerű csere egy másik játékossal
          const otherIndexes = players.map((_, idx) => idx).filter(idx => idx !== pIndex);
          if (otherIndexes.length > 0) {
            const swapIdx = otherIndexes[Math.floor(Math.random() * otherIndexes.length)];
            const swapWith = players[swapIdx];
            const temp = p.position;
            p.position = swapWith.position;
            swapWith.position = temp;
            if (soundEnabled && swapSound) {
              swapSound.currentTime = 0;
              swapSound.play().catch(() => console.warn('Swap sound playback failed.'));
            }
            rollDisabled = true;
            updateRollButton();
            renderBoard();
            renderPlayerList();
            showSwapMessage(`${p.name} helyet cserélt ${swapWith.name}-val`, () => {
              rollDisabled = false;
              // Újrasorsolás a lépés után
              assignSpecialFields();
              assignSwapFields();
              renderBoard();
              beginTurnAt((pIndex + 1) % players.length);
              renderPlayerList();
              updateRollButton();
            });
          } else {
            // Újrasorsolás a lépés után
            assignSpecialFields();
            assignSwapFields();
            renderBoard();
            beginTurnAt((pIndex + 1) % players.length);
            renderBoard();
            renderPlayerList();
          }
        } else if (specialFields.includes(newPos)) {
          // szerencse kerék: megnyitjuk a számhúzást (wheel)
          triggerNumberDraw();
          return;
        } else {
          // Újrasorsolás a lépés után
          assignSpecialFields();
          assignSwapFields();
          renderBoard();
          beginTurnAt((pIndex + 1) % players.length);
          renderBoard();
          renderPlayerList();
        }
      }
    }

    // --- szerencse kerék (number draw) logika ---
    function triggerNumberDraw() {
      // mentjük az állapotot, majd megjelenítjük a kereket
      gameState = {
        players: JSON.parse(JSON.stringify(players)),
        currentPlayer: currentPlayer,
        gameStarted: gameStarted,
        currentRound: currentRound,
        specialFields: [...specialFields],
        swapFields: [...swapFields],
        stopFields: [...stopFields],
        playersSeenThisRound: Array.from(playersSeenThisRound),
        skipNextTurn: { ...skipNextTurn }
      };

      document.getElementById('gameContent').style.display = 'none';
      document.getElementById('numberDraw').style.display = 'flex';
      document.getElementById('stopAnimation').style.display = 'none';

      const wheel = document.getElementById('wheel');
      const resultDisplay = document.getElementById('result');

      resultDisplay.textContent = '';
      resultDisplay.style.display = 'none';
      wheel.innerHTML = '';

      const totalNumbers = 100;
      const containerSize = 90;
      const radiusPercent = 44;
      const radius = (radiusPercent / 100) * containerSize;
      const centerX = 45;
      const centerY = 45;

      for (let i = 1; i <= totalNumbers; i++) {
        const angle = (i - 1) * (360 / totalNumbers);
        const rad = (angle - 90) * (Math.PI / 180);
        const offset = (i % 2 === 0) ? -2 : 2;
        const rAdj = radius + offset;
        const x = centerX + rAdj * Math.cos(rad);
        const y = centerY + rAdj * Math.sin(rad);

        const numberElem = document.createElement('div');
        numberElem.className = 'number';
        numberElem.style.left = `${x}vmin`;
        numberElem.style.top = `${y}vmin`;
        numberElem.style.transform = `translate(-50%, -50%) rotate(${angle}deg) rotate(-${angle}deg)`;
        numberElem.innerText = i;
        wheel.appendChild(numberElem);
      }

      requestAnimationFrame(() => {
        spinWheel();
      });
    }

    function spinWheel() {
      const wheel = document.getElementById('wheel');
      const resultDisplay = document.getElementById('result');
      if (soundEnabled && spinSound) {
        spinSound.currentTime = 0;
        spinSound.play().catch(() => console.warn('Spin sound playback failed.'));
      }
      const selectedNumber = Math.floor(Math.random() * 100) + 1;
      const anglePerNumber = 360 / 100;
      const targetAngle = (selectedNumber - 1) * anglePerNumber;
      const extraSpins = 5 * 360;
      const finalRotation = extraSpins - targetAngle;

      resultDisplay.textContent = '';
      resultDisplay.style.display = 'none';

      wheel.style.transform = 'rotate(0deg)';
      requestAnimationFrame(() => {
        wheel.style.transform = `rotate(${finalRotation}deg)`;
      });

      setTimeout(() => {
        const indicator = document.createElement('span');
        indicator.className = 'player-indicator';
        indicator.style.backgroundColor = players[currentPlayer].color;
        indicator.style.width = '1.5rem';
        indicator.style.height = '1.5rem';
        const oldPosition = players[currentPlayer].position;
        let directionArrow = '';
        if (selectedNumber > oldPosition) {
          directionArrow = `
            <span class="arrow-icon arrow-up">
              <svg viewBox="0 0 24 24">
                <path d="M12 4l-8 8h5v8h6v-8h5z" />
              </svg>
            </span>
          `;
          if (soundEnabled) {
            upSound.currentTime = 0;
            upSound.play().catch(() => console.warn('Up sound playback failed.'));
          }
        } else if (selectedNumber < oldPosition) {
          directionArrow = `
            <span class="arrow-icon arrow-down">
              <svg viewBox="0 0 24 24">
                <path d="M12 20l8-8h-5v-8h-6v8h-5z" />
              </svg>
            </span>
          `;
          if (soundEnabled) {
            downSound.currentTime = 0;
            downSound.play().catch(() => console.warn('Down sound playback failed.'));
          }
        }
        resultDisplay.innerHTML = `Ugrás a ${selectedNumber}. mezőre `;
        resultDisplay.appendChild(indicator);
        if (directionArrow) {
          const arrowContainer = document.createElement('span');
          arrowContainer.innerHTML = directionArrow;
          resultDisplay.appendChild(arrowContainer);
        }
        resultDisplay.style.display = 'flex';
        drawnNumber = selectedNumber;
        console.log(`spinWheel: Játékos ${players[currentPlayer].name} (szín: ${players[currentPlayer].color}), régi pozíció: ${oldPosition}, új pozíció: ${selectedNumber}`);
        setTimeout(finishNumberDraw, 5000);
      }, 5000);
    }

    function finishNumberDraw() {
      document.getElementById('numberDraw').style.display = 'none';
      document.getElementById('gameContent').style.display = 'block';
      document.getElementById('stopAnimation').style.display = 'none';

      // visszaállítjuk az állapotot a mentett játékállapot alapján
      players = gameState.players;
      currentPlayer = gameState.currentPlayer;
      gameStarted = gameState.gameStarted;
      currentRound = gameState.currentRound;
      specialFields = gameState.specialFields;
      swapFields = gameState.swapFields;
      stopFields = gameState.stopFields;
      playersSeenThisRound = new Set(gameState.playersSeenThisRound || []);
      skipNextTurn = { ...(gameState.skipNextTurn || {}) };

      if (drawnNumber) {
        const p = players[currentPlayer];
        p.position = drawnNumber;
        renderBoard();
        renderPlayerList();
        if (p.position === 100) {
          const winner = `${p.name} nyert!`;
          showNewGameDialog(winner);
          return;
        }
        if (stopFields.includes(p.position)) {
          skipNextTurn[p.color] = true;
          showStopAnimation(p.color, () => {
            // Újrasorsolás a szerencsekerék lépés után
            assignSpecialFields();
            assignSwapFields();
            renderBoard();
            beginTurnAt((currentPlayer + 1) % players.length);
            renderPlayerList();
            console.log(`finishNumberDraw: Stop mező eltalálva (kerekből), következő játékos: ${players[currentPlayer].name}, kör: ${currentRound}`);
          });
        } else {
          // Újrasorsolás a szerencsekerék lépés után
          assignSpecialFields();
          assignSwapFields();
          renderBoard();
          beginTurnAt((currentPlayer + 1) % players.length);
          renderPlayerList();
        }
      } else {
        // Újrasorsolás a szerencsekerék lépés után
        assignSpecialFields();
        assignSwapFields();
        renderBoard();
        beginTurnAt((currentPlayer + 1) % players.length);
        renderPlayerList();
      }
    }

    function showNewGameDialog(winnerMessage) {
      if (soundEnabled && fanfareSound) {
        fanfareSound.currentTime = 0;
        fanfareSound.play().catch(() => console.warn('Fanfare sound playback failed.'));
      }
      gameStarted = false;
      const dialog = document.getElementById('newGameDialog');
      document.getElementById('winnerMessage').textContent = winnerMessage;
      dialog.style.display = 'block';
      document.getElementById('stopAnimation').style.display = 'none';
    }

    function showStopAnimation(playerColor, callback) {
      const stopAnimation = document.getElementById('stopAnimation');
      const stopSign = document.getElementById('stopSign');
      const textOverlay = document.getElementById('textOverlay');
      let angle = 0;

      stopAnimation.style.display = 'block';
      document.getElementById('gameContent').style.display = 'none';
      document.getElementById('numberDraw').style.display = 'none';
      gameStarted = false;

      if (soundEnabled && stopSound) {
        stopSound.currentTime = 0;
        stopSound.play().catch(() => console.warn('Stop sound playback failed.'));
      }

      stopSign.style.transition = 'transform 2s';
      stopSign.style.transform = 'translate(-50%, -50%)';
      textOverlay.style.opacity = 0;
      textOverlay.innerHTML = '';

      setTimeout(() => {
        stopSign.style.transform = 'translate(-50%, -50%) rotateY(360deg)';
      }, 10);

      setTimeout(() => {
        stopSign.style.transition = 'transform 0.05s linear';
        const startTime = performance.now();
        function rotate() {
          const elapsed = performance.now() - startTime;
          angle = (elapsed / 1000) * 360;
          stopSign.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
          if (elapsed < 1000) {
            requestAnimationFrame(rotate);
          } else {
            stopSign.style.transition = 'none';
            stopSign.style.transform = `translate(-50%, -50%) rotate(360deg)`;
          }
        }
        requestAnimationFrame(rotate);
      }, 2010);

      setTimeout(() => {
        const indicator = document.createElement('span');
        indicator.className = 'player-indicator';
        indicator.style.backgroundColor = playerColor;
        textOverlay.innerHTML = `egy dobásból kimarad a következő körben `;
        textOverlay.appendChild(indicator);
        textOverlay.style.opacity = 1;
      }, 2010);

      setTimeout(() => {
        stopAnimation.style.display = 'none';
        stopSign.style.transform = 'translate(-50%, -50%)';
        textOverlay.style.opacity = 0;
        textOverlay.innerHTML = '';
        document.getElementById('gameContent').style.display = 'block';
        gameStarted = true;
        if (callback) callback();
      }, 4010);
    }

    function showSwapMessage(message, callback) {
      const swapMessage = document.getElementById('swapMessage');
      swapMessage.textContent = message;
      swapMessage.style.display = 'block';
      setTimeout(() => {
        swapMessage.style.display = 'none';
        if (callback) callback();
      }, 2000);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundText').textContent = soundEnabled ? 'Hang kikapcsolása 🔇' : 'Hang bekapcsolása 🔊';
    }

    function handleNewGame(choice) {
      const dialog = document.getElementById('newGameDialog');
      if (choice) {
        location.reload();
      } else {
        dialog.style.display = 'none';
        gameStarted = false;
      }
    }
  </script>
</body>
