<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Five in a Row</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin: 20px 0 10px;
      text-align: center;
    }

    .button-container {
      margin-top: 10px;
    }

    .new-game-btn {
      background-color: #3498db;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .new-game-btn:hover {
      background-color: #2ecc71;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .new-game-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
      z-index: 0;
    }

    .new-game-btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .spinning-text {
      position: relative;
      z-index: 1;
      transition: transform 0.3s ease;
      display: inline-block;
    }

    .new-game-btn:hover .spinning-text {
      animation: spinX 1s infinite linear;
    }

    @keyframes spinX {
      0% {
        transform: rotateX(0deg);
      }
      100% {
        transform: rotateX(360deg);
      }
    }

    .board {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 1px;
      width: 90vmin;
      max-width: 600px;
      aspect-ratio: 1 / 1;
      margin: 10px auto 20px;
    }

    .cell {
      background-color: white;
      border: 1px solid black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8vmin;
      cursor: pointer;
      aspect-ratio: 1 / 1;
      user-select: none;
    }

    .winner {
      color: green;
      font-size: 20px;
      margin-bottom: 5px;
    }

    #newGamePrompt {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0,0,0,0.85);
      padding: 25px 35px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
      display: none;
      z-index: 10;
      text-align: center;
      color: white;
    }

    #newGamePrompt p {
      font-size: 22px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    #newGamePrompt .prompt-button-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 20px;
    }

    #newGamePrompt button {
      background-color: #3498db;
      border: none;
      padding: 15px 30px;
      border-radius: 25px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #newGamePrompt button:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      background-color: #2ecc71;
    }

    #newGamePrompt button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
    }

    #newGamePrompt button:hover::before {
      width: 300px;
      height: 300px;
    }

    #newGamePrompt button .spinning-text {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    #newGamePrompt button:hover .spinning-text {
      animation: spinX 1s infinite linear;
    }
  </style>
</head>
<body>
  <h1>Five in a Row</h1>

  <div class="button-container">
    <button class="new-game-btn" onclick="resetGame()">
      <span class="spinning-text">Új Játék</span>
    </button>
  </div>

  <div id="winner" class="winner"></div>
  <div id="board" class="board"></div>

  <div id="newGamePrompt">
    <p>Új játék?</p>
    <div class="prompt-button-container">
      <button id="yesButton"><span class="spinning-text">Igen</span></button>
      <button id="noButton"><span class="spinning-text">Nem</span></button>
    </div>
  </div>

  <script>
    const BOARD_SIZE = 15;
    const WIN_COUNT = 5;
    let board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));
    let currentPlayer = "X";
    let gameOver = false;

    const winnerDiv = document.getElementById("winner");
    const newGamePrompt = document.getElementById("newGamePrompt");
    const yesButton = document.getElementById("yesButton");
    const noButton = document.getElementById("noButton");

    function createBoard() {
      const boardElement = document.getElementById("board");
      boardElement.innerHTML = "";
      board.forEach((row, rIdx) => {
        row.forEach((cell, cIdx) => {
          const div = document.createElement("div");
          div.classList.add("cell");
          div.textContent = cell || "";
          div.onclick = () => makeMove(rIdx, cIdx);
          boardElement.appendChild(div);
        });
      });
    }

    function makeMove(row, col) {
      if (board[row][col] || gameOver) return;
      board[row][col] = currentPlayer;
      createBoard();
      if (checkWin(row, col)) {
        winnerDiv.textContent = `Győzött: ${currentPlayer}!`;
        gameOver = true;
        showNewGamePrompt();
      } else {
        currentPlayer = currentPlayer === "X" ? "O" : "X";
      }
    }

    function checkWin(row, col) {
      const directions = [
        [0, 1], [1, 0], [1, 1], [1, -1]
      ];
      for (const [dx, dy] of directions) {
        let count = 1;
        for (let i = 1; i < WIN_COUNT; i++) {
          if (board[row + dx * i]?.[col + dy * i] === currentPlayer) count++;
          else break;
        }
        for (let i = 1; i < WIN_COUNT; i++) {
          if (board[row - dx * i]?.[col - dy * i] === currentPlayer) count++;
          else break;
        }
        if (count >= WIN_COUNT) return true;
      }
      return false;
    }

    function resetGame() {
      board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));
      currentPlayer = "X";
      gameOver = false;
      winnerDiv.textContent = "";
      newGamePrompt.style.display = "none";
      createBoard();
    }

    function showNewGamePrompt() {
      newGamePrompt.style.display = "block";
    }

    yesButton.addEventListener("click", () => {
      resetGame();
    });

    noButton.addEventListener("click", () => {
      newGamePrompt.style.display = "none";
      try {
        window.open('', '_self').close();
      } catch {
        // Ha nem engedi a böngésző, csak elrejti
      }
    });

    createBoard();
  </script>
</body>
</html>
