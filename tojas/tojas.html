<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lehulló Tojás Játék</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #score-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 20px;
            font-family: Arial, sans-serif;
            z-index: 10;
        }

        #score, #bestScore, #missedEggs {
            font-size: 18px;
            color: #333;
        }

        #gameArea {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 70vh;
            max-height: 600px;
            border: 2px solid black;
            background-color: #87CEEB;
            overflow: hidden;
            touch-action: none;
        }

        .egg {
            position: absolute;
            width: 50px;
            height: 70px;
            background-color: transparent;
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #basket {
            position: absolute;
            bottom: 10px;
            width: 100px;
            height: 50px;
            background-color: transparent;
        }

        #playAgainDialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 1000;
            text-align: center;
        }

        button {
            background-color: #3498db;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 25px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            display: inline-block;
            text-align: center;
        }

        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background-color: #2ecc71;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        .spinning-text {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        button:hover .spinning-text {
            animation: spinX 1s infinite linear;
        }

        @keyframes spinX {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(360deg); }
        }

        #playAgainDialog button {
            padding: 5px 15px;
            margin: 0 10px;
        }

        #soundToggle, #pauseButton {
            padding: 5px 15px;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            .egg { width: 40px; height: 56px; }
            #basket { width: 80px; height: 40px; }
            #score-section { font-size: 16px; gap: 10px; }
            #pauseButton { padding: 5px 10px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="score-section">
        <div id="score">Pontszám: 0</div>
        <div id="bestScore">Legmagasabb pontszám: Nincs - None</div>
        <div id="missedEggs">El nem kapott tojások: 0</div>
        <button id="soundToggle" onclick="toggleSound()"><span class="spinning-text">Hang bekapcsolása 🔊</span></button>
    </div>
    <button id="pauseButton" onclick="togglePause()"><span class="spinning-text">Szünet</span></button>
    <div id="gameArea">
        <img id="basket" src="basket.png" alt="Kosár" onerror="this.style.backgroundColor='#8B4513'; this.src='';">
    </div>
    <div id="playAgainDialog">
        <p>Szeretnél újra játszani?</p>
        <button id="yesButton"><span class="spinning-text">Igen</span></button>
        <button id="noButton"><span class="spinning-text">Nem</span></button>
    </div>

    <audio id="catchSound" src="catch.mp3"></audio>
    <audio id="fallSound" src="fall.mp3"></audio>

    <script>
        const gameArea = document.getElementById('gameArea');
        const basket = document.getElementById('basket');
        const scoreElement = document.getElementById('score');
        const bestScoreElement = document.getElementById('bestScore');
        const missedEggsElement = document.getElementById('missedEggs');
        const playAgainDialog = document.getElementById('playAgainDialog');
        const catchSound = document.getElementById('catchSound');
        const fallSound = document.getElementById('fallSound');
        const soundToggleButton = document.getElementById('soundToggle');
        const pauseButton = document.getElementById('pauseButton');
        let score = 0;
        let missedEggs = 0;
        let basketX = gameArea.offsetWidth / 2 - 50;
        let gameOver = false;
        let isPaused = false;
        let soundEnabled = false;
        const eggs = [];
        const eggImages = ['egg1.png', 'egg2.png', 'egg3.png', 'golden_egg.png'];
        const basketWidth = 100;

        let bestScore = localStorage.getItem('eggGameBestScore') ? parseInt(localStorage.getItem('eggGameBestScore')) : 0;
        let bestScoreName = localStorage.getItem('eggGameBestScoreName') || 'None';

        function updateBestScoreDisplay() {
            if (bestScore === 0) {
                bestScoreElement.textContent = `Legmagasabb pontszám: Nincs - None`;
            } else {
                bestScoreElement.textContent = `Legmagasabb pontszám: ${bestScore} - ${bestScoreName}`;
            }
        }

        function updateScoreDisplay() {
            scoreElement.textContent = `Pontszám: ${score}`;
        }

        function updateMissedEggsDisplay() {
            missedEggsElement.textContent = `El nem kapott tojások: ${missedEggs}`;
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            soundToggleButton.innerHTML = `<span class="spinning-text">Hang ${soundEnabled ? 'kikapcsolása 🔇' : 'bekapcsolása 🔊'}</span>`;
        }

        function togglePause() {
            if (gameOver) return;
            isPaused = !isPaused;
            pauseButton.innerHTML = `<span class="spinning-text">${isPaused ? 'Folytatás' : 'Szünet'}</span>`;
            console.log(isPaused ? 'Szünet' : 'Folytatás');
        }

        function getRandomEggImage() {
            const isGolden = Math.random() < 0.1;
            if (isGolden) return { image: 'golden_egg.png', isGolden: true };
            const randomIndex = Math.floor(Math.random() * 3);
            return { image: eggImages[randomIndex], isGolden: false };
        }

        function createEgg() {
            const egg = document.createElement('img');
            const eggData = getRandomEggImage();
            egg.classList.add('egg');
            egg.src = eggData.image;
            egg.isGolden = eggData.isGolden;
            egg.style.left = Math.random() * (gameArea.offsetWidth - 50) + 'px';
            egg.style.top = '0px';
            egg.speed = 2 + Math.random() * 2;
            gameArea.appendChild(egg);
            eggs.push(egg);
        }

        function moveEggs() {
            if (gameOver || isPaused) return;

            eggs.forEach((egg, index) => {
                let eggY = parseFloat(egg.style.top);
                eggY += egg.speed;
                egg.style.top = eggY + 'px';

                const eggX = parseFloat(egg.style.left);
                const eggWidth = 50;
                const eggHeight = 70;
                const basketHeight = 50;
                const basketY = gameArea.offsetHeight - basketHeight - 10;

                const eggLeft = eggX;
                const eggRight = eggX + eggWidth;
                const eggBottom = eggY + eggHeight;
                const basketLeft = basketX;
                const basketRight = basketX + basketWidth;
                const basketTop = basketY;

                if (
                    eggBottom >= basketTop &&
                    eggRight >= basketLeft &&
                    eggLeft <= basketRight
                ) {
                    if (egg.isGolden && missedEggs > 0 && missedEggs <= 2) {
                        missedEggs--;
                        updateMissedEggsDisplay();
                    }
                    score++;
                    updateScoreDisplay();
                    if (soundEnabled) {
                        catchSound.currentTime = 0;
                        catchSound.play();
                    }
                    gameArea.removeChild(egg);
                    eggs.splice(index, 1);
                } else if (eggY > gameArea.offsetHeight) {
                    if (!egg.isGolden) {
                        missedEggs++;
                        updateMissedEggsDisplay();
                    }
                    if (soundEnabled) {
                        fallSound.currentTime = 0;
                        fallSound.play();
                    }
                    gameArea.removeChild(egg);
                    eggs.splice(index, 1);

                    if (missedEggs >= 3) {
                        gameOver = true;
                        if (score > bestScore) {
                            let playerName = prompt(`Új rekord! Pontszám: ${score}\nAdd meg a neved:`);
                            if (playerName) {
                                bestScore = score;
                                bestScoreName = playerName;
                                localStorage.setItem('eggGameBestScore', bestScore);
                                localStorage.setItem('eggGameBestScoreName', bestScoreName);
                                updateBestScoreDisplay();
                            }
                        }
                        playAgainDialog.style.display = 'block';
                    }
                }
            });
        }

        // Kosár mozgatása billentyűzettel
        document.addEventListener('keydown', (event) => {
            if (gameOver) return;
            if (event.key === 'ArrowLeft' && basketX > 0) {
                basketX -= 20;
                basket.style.left = basketX + 'px';
            } else if (event.key === 'ArrowRight' && basketX < gameArea.offsetWidth - basketWidth) {
                basketX += 20;
                basket.style.left = basketX + 'px';
            } else if (event.key === ' ' || event.key === 'Spacebar') {
                event.preventDefault();
                togglePause();
            }
        });

        // Kosár mozgatása egérrel
        gameArea.addEventListener('mousemove', (event) => {
            if (gameOver || isPaused) return;
            const gameAreaRect = gameArea.getBoundingClientRect();
            const mouseX = event.clientX - gameAreaRect.left;
            basketX = Math.max(0, Math.min(gameArea.offsetWidth - basketWidth, mouseX));
            basket.style.left = basketX + 'px';
        });

        // Kosár mozgatása érintéssel (mobil)
        let isTouching = false;
        gameArea.addEventListener('touchstart', (event) => {
            event.preventDefault();
            isTouching = true;
        });

        gameArea.addEventListener('touchmove', (event) => {
            event.preventDefault();
            if (!isTouching || gameOver || isPaused) return;
            const touch = event.touches[0];
            const gameAreaRect = gameArea.getBoundingClientRect();
            const touchX = touch.clientX - gameAreaRect.left;
            basketX = Math.max(0, Math.min(gameArea.offsetWidth - basketWidth, touchX));
            basket.style.left = basketX + 'px';
        });

        gameArea.addEventListener('touchend', (event) => {
            event.preventDefault();
            isTouching = false;
        });

        // Új tojás létrehozása időközönként
        setInterval(() => {
            if (!gameOver && !isPaused && eggs.length < 3) {
                createEgg();
            }
        }, 1500);

        // Játék ciklus
        setInterval(moveEggs, 20);

        // Kezdő pozíció beállítása
        basketX = gameArea.offsetWidth / 2 - basketWidth / 2;
        basket.style.left = basketX + 'px';

        // Újrajátszás gombok
        document.getElementById('yesButton').addEventListener('click', () => {
            score = 0;
            missedEggs = 0;
            gameOver = false;
            isPaused = false;
            basketX = gameArea.offsetWidth / 2 - basketWidth / 2;
            basket.style.left = basketX + 'px';
            updateScoreDisplay();
            updateMissedEggsDisplay();
            pauseButton.innerHTML = `<span class="spinning-text">Szünet</span>`;
            eggs.forEach(egg => gameArea.removeChild(egg));
            eggs.length = 0;
            playAgainDialog.style.display = 'none';
        });

        document.getElementById('noButton').addEventListener('click', () => {
            playAgainDialog.style.display = 'none';
            window.close();
        });

        // Kezdeti kijelzések
        updateScoreDisplay();
        updateBestScoreDisplay();
        updateMissedEggsDisplay();
    </script>
</body>
</html>
