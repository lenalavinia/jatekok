<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eltelt napok száma</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 1em;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #0066cc;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 1.5em;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        label, input, button {
            display: block;
            width: 100%;
            margin-bottom: 1em;
        }

        input, button {
            padding: 0.7em;
            font-size: 1em;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #0066cc;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #004d99;
        }

        #result {
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                margin: 1em;
            }
        }
    </style>
</head>
<body>
    <h1>Eltelt napok száma</h1>
    <div class="container">
        <label for="inputDate">Add meg a dátumot:</label>
        <input type="date" id="inputDate">
        <button onclick="calculateDifference()">Számol</button>
        <p id="result"></p>
    </div>

    <script>
        function calculateDifference() {
            const inputDate = new Date(document.getElementById('inputDate').value);
            const currentDate = new Date();

            if (isNaN(inputDate)) {
                document.getElementById('result').textContent = "Kérlek adj meg egy érvényes dátumot!";
                return;
            }

            let start = new Date(inputDate);
            let end = new Date(currentDate);

            // Teljes napok különbsége
            const oneDay = 24 * 60 * 60 * 1000;
            const totalDays = Math.floor((end - start) / oneDay);

            // Év, hónap, nap különbség
            let years = end.getFullYear() - start.getFullYear();
            let months = end.getMonth() - start.getMonth();
            let days = end.getDate() - start.getDate();

            if (days < 0) {
                months--;
                let prevMonth = new Date(end.getFullYear(), end.getMonth(), 0);
                days += prevMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById('result').textContent = 
                `Eltelt idő: ${years} év, ${months} hónap, ${days} nap (${totalDays} nap összesen).`;
        }
    </script>
</body>
</html>
